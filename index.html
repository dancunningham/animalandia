// Best guess at where we are: the time zone if we know it, otherwise the UTC
// offset gives us a longitude and we assume a mid-northern latitude.
function guessPosition(){
  let tz = "";
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch(e){}
  if (TZ_POINTS[tz]) return TZ_POINTS[tz];
  // getTimezoneOffset() is minutes *behind* local time, so UTC-5 gives 300.
  const lon = -new Date().getTimezoneOffset() / 4;
  return [20, Math.max(-180, Math.min(180, lon))];
}

// Great-circle distance in km.
function haversine(aLat, aLon, bLat, bLon){
  const R = 6371, rad = Math.PI/180;
  const dLat = (bLat-aLat)*rad, dLon = (bLon-aLon)*rad;
  const s = Math.sin(dLat/2)**2
          + Math.cos(aLat*rad)*Math.cos(bLat*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1, Math.sqrt(s)));
}

function nearestLang(){
  const [lat, lon] = guessPosition();
  let best = "en", bestD = Infinity;
  for (const a of LANG_ANCHORS){
    const d = haversine(lat, lon, a.lat, a.lon);
    if (d < bestD){ bestD = d; best = a.lang; }
  }
  return best;
}

    const saved = localStorage.getItem(LANG_STORE);
    if (saved === "es" || saved === "en") return saved;
  } catch(e){}
  return nearestLang();
})();

const JUMP_KEYS = ["Space","ArrowUp","KeyW"];
const LEFT_KEYS = ["ArrowLeft","KeyA"];
const RIGHT_KEYS = ["ArrowRight","KeyD"];
const DUCK_KEYS = ["ArrowDown","KeyS"];

addEventListener("keydown", (e) => {
  if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) {
    // edge events (only on first press)
    if (JUMP_KEYS.includes(e.code)) jumpBuffer = BUFFER;
    if (e.code === "Enter" || e.code === "Space") confirmEdge = true;
    if (LEFT_KEYS.includes(e.code)) leftEdge = true;
    if (RIGHT_KEYS.includes(e.code)) rightEdge = true;
    if (e.code === "KeyP" || e.code === "Escape") pauseEdge = true;
    if (e.code === "KeyM") muteEdge = true;
    if (e.code === "KeyR") resetEdge = true;
    if (e.code === "KeyH") scoresEdge = true;
  }
  if (JUMP_KEYS.includes(e.code) || LEFT_KEYS.includes(e.code) ||
      RIGHT_KEYS.includes(e.code) || DUCK_KEYS.includes(e.code)) touchMode = false;
  keys[e.code] = true;
  ensureAudio();
}, { passive:false });

addEventListener("keyup", (e) => { keys[e.code] = false; });

function held(list){ return list.some(k => keys[k]); }

// Input — touch (tablet). Left drag-stick, two buttons on the right.
// ------------------------------------------------------------------
const STICK = { cx:140, cy:458, w:230, h:86, knobR:36, range:74 };
const BTN_JUMP = { cx:856, cy:388, r:52 };
const BTN_DUCK = { cx:856, cy:482, r:40 };
const BTN_PAUSE = { cx:928, cy:32, r:22 };

// The on-screen controls are shown by default (this is a tablet-first game).
// They hide only while someone is actively using the keyboard, and come
// straight back on the next tap or click.
let touchMode = true;
const touch = {
  stickId:null, knob:0, dir:0,
  jumpId:null, jumpDown:false,
  duckId:null, duckDown:false,
};
let uiButtons = [];   // rebuilt every render: { id, x, y, w, h }
let uiTap = null;     // id of the button tapped since the last update

function uiButton(id, x, y, w, h){ uiButtons.push({ id, x, y, w, h }); }
function hitUI(p){
  for (let i = uiButtons.length - 1; i >= 0; i--){
    const b = uiButtons[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b.id;
  }
  return null;
}
function inCircle(p, c){
  const dx = p.x - c.cx, dy = p.y - c.cy;
  return dx*dx + dy*dy <= c.r*c.r * 1.35; // a little forgiving for small fingers
}
function inStick(p){
  return p.x >= STICK.cx - STICK.w/2 - 30 && p.x <= STICK.cx + STICK.w/2 + 30 &&
         p.y >= STICK.cy - STICK.h/2 - 30 && p.y <= STICK.cy + STICK.h/2 + 30;
}
function canvasPos(e){
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
function playing(){ return state === "playing" || state === "countdown" || state === "race"; }

function onDown(e){
  ensureAudio();
  touchMode = true;
  const p = canvasPos(e);

  if (playing() || state === "paused"){
    if (inCircle(p, BTN_PAUSE)){ pauseEdge = true; return; }
  }
  if (playing()){
    if (inCircle(p, BTN_JUMP)){
      touch.jumpId = e.pointerId; touch.jumpDown = true; jumpBuffer = BUFFER; return;
    }
    if (inCircle(p, BTN_DUCK)){
      touch.duckId = e.pointerId; touch.duckDown = true; return;
    }
    if (inStick(p) || p.x < W/2){
      touch.stickId = e.pointerId;
      touch.knob = Math.max(-STICK.range, Math.min(STICK.range, p.x - STICK.cx));
      return;
    }
    return;
  }

  // menus: buttons drawn by the last render
  const id = hitUI(p);
  if (id) uiTap = id;
  else if (state === "paused") pauseEdge = true;
}

function onMove(e){
  if (e.pointerId !== touch.stickId) return;
  const p = canvasPos(e);
  touch.knob = Math.max(-STICK.range, Math.min(STICK.range, p.x - STICK.cx));
}

function onUp(e){
  if (e.pointerId === touch.stickId){ touch.stickId = null; touch.knob = 0; }
  if (e.pointerId === touch.jumpId){ touch.jumpId = null; touch.jumpDown = false; }
  if (e.pointerId === touch.duckId){ touch.duckId = null; touch.duckDown = false; }
}

canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); onDown(e); });
canvas.addEventListener("pointermove", (e) => { e.preventDefault(); onMove(e); });
canvas.addEventListener("pointerup", (e) => { e.preventDefault(); onUp(e); });
canvas.addEventListener("pointercancel", (e) => { onUp(e); });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

// the stick only counts as a direction past a small deadzone
function stickDir(){
  if (touch.stickId === null) return 0;
  if (touch.knob > 12) return 1;
  if (touch.knob < -12) return -1;
  return 0;
}
const jumpHeld  = () => held(JUMP_KEYS) || touch.jumpDown;
const leftHeld  = () => held(LEFT_KEYS) || stickDir() === -1;
const rightHeld = () => held(RIGHT_KEYS) || stickDir() === 1;
const duckHeld  = () => held(DUCK_KEYS) || touch.duckDown;

// Audio (generated, no asset files)

let actx = null, muted = false;
function ensureAudio(){
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (actx && actx.state === "suspended") actx.resume();
}
function beep(freq, dur=0.12, type="square", vol=0.15){
  if (!actx || muted) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(actx.destination);
  const t = actx.currentTime;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur);
}

  timer:null, track:null, step:0,
  tempo:{ calm:300, fast:165 },
  mel:{
    calm:[392,null,466,null,523,null,466,null,392,null,349,null,311,null,349,null],
    fast:[523,659,784,659,523,659,784,880,784,659,523,440,523,659,784,880],
  },
  bass:{
    calm:[131,null,null,null,98,null,null,null,110,null,null,null,98,null,null,null],
    fast:[131,131,174,174,196,196,174,174,131,131,174,174,196,196,220,220],
  },
  start(track){
    if (this.track === track && this.timer) return;
    this.track = track; this.step = 0;
    if (this.timer) clearInterval(this.timer);
    this.timer = setInterval(() => this.tick(), this.tempo[track]);
  },
  stop(){ if (this.timer) clearInterval(this.timer); this.timer = null; this.track = null; },
  tick(){
    if (!actx || muted || !this.track) return;
    const fast = this.track === "fast";
    const m = this.mel[this.track][this.step % this.mel[this.track].length];
    const b = this.bass[this.track][this.step % this.bass[this.track].length];
    if (m) this.note(m, fast ? "square" : "triangle", fast ? 0.06 : 0.05, fast ? 0.14 : 0.30);
    if (b) this.note(b, "sine", 0.09, fast ? 0.14 : 0.34);
    this.step++;
  },
  note(freq, type, vol, dur){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.03);
  },
  sync(){
    if (!actx || state === "paused") return;
    this.start(state === "race" ? "fast" : "calm");
  },
};

// ------------------------------------------------------------------
// Collision (AABB)
// ------------------------------------------------------------------
function overlaps(a, s){
  return a.x < s.x + s.w && a.x + a.w > s.x && a.y < s.y + s.h && a.y + a.h > s.y;
}

function collideX(){
  player.blockedLeft = player.blockedRight = false;
  player.x += player.vx;
  for (const s of SOLIDS){
    if (s.broken) continue;
    if (overlaps(player, s)){
      // step assist: walk straight up onto very low things (the trampoline)
      const rise = player.y + player.h - s.y;
      if (player.grounded && rise > 0 && rise <= 24){ player.y = s.y - player.h; continue; }
      if (player.vx > 0){ player.x = s.x - player.w; player.blockedRight = true; }
      else if (player.vx < 0){ player.x = s.x + s.w; player.blockedLeft = true; }
      player.vx = 0;
    }
  }
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > WORLD_END) player.x = WORLD_END - player.w;
}

function collideY(){
  const wasGrounded = player.grounded;
  player.grounded = false; player.standing = null;
  player.y += player.vy;
  for (const s of SOLIDS){
    if (s.broken) continue;
    if (overlaps(player, s)){
      if (player.vy > 0){ player.y = s.y - player.h; player.grounded = true; player.standing = s; }
      else if (player.vy < 0){ player.y = s.y + s.h; }
      player.vy = 0;
    }
  }
  if (player.grounded && !wasGrounded && player.vy === 0) sfx.land();
}

// is the player standing on a patch of polished ice rink?
function onRink(){
  if (!RINKS.length || !player.grounded) return false;
  const cx = player.x + player.w/2;
  for (const r of RINKS) if (cx >= r.x && cx <= r.x + r.w) return true;
  return false;
}

// which pool (if any) the player is standing in
function waterAt(){
  const foot = player.y + player.h;
  const cx = player.x + player.w/2;
  // on an icy level the ice platforms and ice blocks are ice too, so standing on
  // one tops the fish up — without this the crevasse is longer than its 10 seconds
  if (THEME.refill === "ice" && player.standing &&
      (player.standing.type === "melt" || player.standing.type === "iceblock")) return player.standing;
  for (const wt of WATERS){
    if (cx >= wt.x && cx <= wt.x + wt.w && foot > GROUND_Y - WATER_H && foot <= GROUND_Y + 6) return wt;
  }
  return null;
}

// ------------------------------------------------------------------
// Player update
// ------------------------------------------------------------------
function updatePlayer(allowInput){
  const a = player.ch;

  // --- water ---
  const pool = waterAt();
  player.inWater = !!pool;

  // --- air span (fish) ---
  if (a.airSpan){
    if (player.inWater){
      if (player.air < a.airSpan * 0.5) splash(player.x + player.w/2, GROUND_Y - 18, 3);
      player.air = a.airSpan;
    } else {
      player.air--;
      if (player.air > 0 && player.air < 180 && player.air % 45 === 0) sfx.gasp();
      if (player.air <= 0){
        sfx.sink();
        respawn();
        return;
      }
    }
  }

  // --- duck (hold it down) ---
  const wantDuck = allowInput && duckHeld() && player.grounded && player.dashTimer <= 0;
  const targetH = wantDuck ? PH_DUCK : PH;
  if (player.h !== targetH){
    player.y += player.h - targetH;   // keep the feet planted
    player.h = targetH;
  }
  player.ducking = wantDuck;

  // --- octopus ink-jet dash (the jump button, which the octopus can't use to jump) ---
  if (a.dash){
    if (player.dashCooldown > 0) player.dashCooldown--;
    if (player.dashTimer  > 0) player.dashTimer--;
    if (allowInput && jumpBuffer > 0 && player.dashTimer <= 0 && player.dashCooldown <= 0){
      player.dashTimer = DASH_TIME;
      player.dashCooldown = DASH_COOLDOWN;
      player.dashDir = player.facing;
      jumpBuffer = 0;
      sfx.dash();
    }
  }

  // --- horizontal input ---
  let dir = 0;
  if (allowInput){
    if (leftHeld()) dir -= 1;
    if (rightHeld()) dir += 1;
  }
  let maxSpeed = a.run;
  if (a.swim && player.inWater) maxSpeed = a.swimRun;   // the fish flies through water
  if (player.ducking) maxSpeed *= DUCK_SPEED;
  const accel = a.accel;
  if (dir !== 0){
    if (Math.abs(player.vx) > maxSpeed){
      // boosted above top speed (dash / slingshot / rocketing out of a pool)
      // — bleed off gently so the launch actually carries you somewhere
      player.vx += (player.vx > 0 ? -0.12 : 0.12);
    } else {
      player.vx += dir * accel;
      if (player.vx >  maxSpeed) player.vx =  maxSpeed;
      if (player.vx < -maxSpeed) player.vx = -maxSpeed;
    }
    player.facing = dir;
  } else {
    player.vx *= onRink() ? 0.975 : 0.85;   // polished ice keeps you sliding
    if (Math.abs(player.vx) < 0.05) player.vx = 0;
  }

  // dash overrides movement for its duration, and squirts an ink trail
  if (player.dashTimer > 0){
    player.vx = player.dashDir * DASH_SPEED;
    player.facing = player.dashDir;
    if (player.dashTimer % 2 === 0){
      inkParts.push({
        x: player.x + player.w/2 - player.dashDir * player.w * 0.45,
        y: player.y + player.h * 0.55,
        vx: -player.dashDir * (1 + Math.random()*1.6), vy: (Math.random()-0.5)*1.2 - 0.3,
        life: 0, max: 22 + Math.random()*12, r: 5 + Math.random()*5,
      });
    }
  }

  collideX();

  // --- octopus climb-over ---
  let climbing = false;
  if (a.climb && allowInput){
    if ((rightHeld() && player.blockedRight) || (leftHeld() && player.blockedLeft)) climbing = true;
  }

  // --- climb slingshot: launch forward when the octopus crawls over the top ---
  if (a.climb){
    if (player.wasClimbing && !climbing){
      player.vx = player.facing * SLINGSHOT_SPEED;
      player.vy = Math.min(player.vy, -3);
      sfx.boing();
    }
    player.wasClimbing = climbing;
  }

  // --- jump / pounce ---
  player.coyote = player.grounded ? COYOTE : Math.max(0, player.coyote - 1);
  player.justJumped = false;
  if (allowInput && !climbing && !player.ducking && a.jump > 0 &&
      jumpBuffer > 0 && player.coyote > 0){
    let jv = a.jump;
    if (a.pounce){
      // the faster the tiger is running, the bigger the pounce
      jv = a.jump + (Math.abs(player.vx) / a.run) * 5.5;
      player.noJumpCut = 60;
    }
    player.vy = -jv;
    player.grounded = false; player.coyote = 0; jumpBuffer = 0;
    player.justJumped = true;
    if (a.pounce && Math.abs(player.vx) > a.run * 0.6) sfx.pounce(); else sfx.jump();
  }
  // the fish flicks its tail to swim upward while it is in a pool
  if (allowInput && a.swim && player.inWater && jumpBuffer > 0 && !player.ducking){
    player.vy = -a.jump; jumpBuffer = 0; player.justJumped = true;
    splash(player.x + player.w/2, GROUND_Y - 20, 5);
    sfx.jump();
  }

  // --- vertical motion ---
  if (climbing){
    player.vy = -CLIMB_SPEED;
  } else {
    let g = GRAVITY * a.grav;
    if (a.swim && player.inWater) g *= 0.4;                       // floaty in water
    if (player.vy < 0 && jumpHeld() && !a.pounce) g *= 0.5;       // variable jump height
    player.vy += g;
    if (player.noJumpCut > 0) player.noJumpCut--;
    else if (!jumpHeld() && player.vy < -4 && !player.justJumped) player.vy = -4; // jump cut
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;
  }

  collideY();

  // --- rolling logs: ride along the top, get bumped if one catches your side ---
  if (player.hitCool > 0) player.hitCool--;
  if (!a.tough){
    for (const l of logs){
      const box = { x:l.x, y:l.y, w:LOG_ZONE.w, h:LOG_ZONE.h };
      if (!overlaps(player, box)) continue;
      const prevBottom = player.y + player.h - Math.max(0, player.vy);
      if (player.vy >= 0 && prevBottom <= l.y + 10){
        player.y = l.y - player.h;
        player.vy = 0;
        player.grounded = true;
        player.standing = { type:"log" };
        player.x -= LOG_ZONE.speed;   // the log carries you back as it rolls
      } else if (player.hitCool <= 0){
        sfx.bump();
        player.vx = -2.6; player.vy = -4;
        player.grounded = false;
        player.hurtFlash = 40; player.hitCool = 50;
      }
    }
  }

  // --- melting ice platforms: 3 seconds once you put a foot on one ---
  if (player.grounded && player.standing && player.standing.type === "melt"){
    const m = player.standing;
    if (m.timer < 0){ m.timer = MELT_TIME; sfx.crack(); }
  }

  // --- spider-web trampoline ---
  if (player.grounded && player.standing && player.standing.type === "web"){
    player.vy = -BOUNCE_VY;
    player.grounded = false; player.coyote = 0;
    player.noJumpCut = 60;   // a trampoline bounce is always full height
    sfx.boing();
  }

  // --- hazards (the octopus oozes through all of them) ---
  if (!a.tough){
    for (const hz of HAZARDS){
      // ducked = you slip underneath the low leaves and the low clouds
      if ((hz.kind === "lowleaf" || hz.kind === "cloud") && player.ducking) continue;
      if (overlaps(player, hz)){
        if (hz.kind === "poison" || hz.kind === "freeze" || hz.kind === "hole") sfx.splash();
        else if (hz.kind === "fire") sfx.burn();
        else sfx.bump();
        respawn();
        return;
      }
    }
  }

  // --- volcano fireballs ---
  if (!a.tough){
    for (const f of fireballs){
      if (overlaps(player, { x:f.x-FIRE_R, y:f.y-FIRE_R, w:FIRE_R*2, h:FIRE_R*2 })){
        sfx.burn();
        respawn();
        return;
      }
    }
  }

  // --- snowballs: duck under them or they knock you back ---
  if (!a.tough && !player.ducking){
    for (const sb of snowballs){
      if (overlaps(player, { x:sb.x-SNOW_R, y:sb.y-SNOW_R, w:SNOW_R*2, h:SNOW_R*2 })){
        sfx.bump();
        respawn();
        return;
      }
    }
  }

  // --- falling icicles ---
  if (!a.tough){
    for (const ic of ICICLES){
      if (!ic.falling) continue;
      if (overlaps(player, { x:ic.x-9, y:ic.y, w:18, h:46 })){
        sfx.bump();
        respawn();
        return;
      }
    }
  }

  // --- fell off the world (safety net) ---
  if (player.y > H + 60){
    sfx.splash();
    respawn();
    return;
  }

  // --- checkpoints ---
  for (let i = 0; i < CHECKPOINTS.length; i++){
    const c = CHECKPOINTS[i];
    if (player.x >= c.tx && player.reachedCheck < i){
      player.reachedCheck = i;
      player.respawnX = c.rx;
      sfx.check();
    }
  }

  // run bob for animation
  player.runBob = (player.grounded && Math.abs(player.vx) > 0.5)
    ? player.runBob + Math.abs(player.vx) * 0.25 : 0;
  if (player.hurtFlash > 0) player.hurtFlash--;
}

function splash(x, y, n){
  for (let i = 0; i < n; i++){
    inkParts.push({
      x, y, vx:(Math.random()-0.5)*2.4, vy:-1 - Math.random()*2,
      life:0, max:16 + Math.random()*10, r:2 + Math.random()*3, c:"120,200,255",
    });
  }
}

// ------------------------------------------------------------------
// Rolling logs
// ------------------------------------------------------------------
function updateLogs(){
  if (!LOG_ZONE) return;
  logSpawn--;
  if (logSpawn <= 0){
    logs.push({ x: LOG_ZONE.x1, y: GROUND_Y - LOG_ZONE.h });
    logSpawn = LOG_ZONE.interval;
  }
  for (const l of logs) l.x -= LOG_ZONE.speed;
  if (logs.length) logs = logs.filter(l => l.x + LOG_ZONE.w > LOG_ZONE.x0);
}

// ------------------------------------------------------------------
// Volcano
// ------------------------------------------------------------------
function updateVolcano(){
  if (!VOLCANO) return;
  eruptTimer--;
  if (eruptTimer <= 0){
    eruptTimer = ERUPT_INTERVAL;
    const cx = VOLCANO.x + VOLCANO.w/2;
    for (let i = -1; i <= 1; i++){
      fireballs.push({
        x: cx + i*13, y: VOLCANO.y - 8,
        vx: i*1.15, vy: -12 - Math.random()*1.4,
        spin: Math.random()*6,
      });
    }
    if (Math.abs(player.x - cx) < 900) sfx.erupt();
  }
  for (const f of fireballs){ f.x += f.vx; f.y += f.vy; f.vy += 0.35; f.spin += 0.3; }
  if (fireballs.length) fireballs = fireballs.filter(f => f.y < H + 60);
}

// ------------------------------------------------------------------
// The Icy Way: snowballs, icicles and melting platforms
// ------------------------------------------------------------------
function updateSnow(){
  if (!SNOW_ZONE) return;
  snowTimer--;
  if (snowTimer <= 0){
    snowTimer = SNOW_ZONE.interval;
    snowballs.push({ x: SNOW_ZONE.x1, y: SNOW_ZONE.y, spin: 0 });
    if (Math.abs(player.x - SNOW_ZONE.x1) < 1200) sfx.whoosh();
  }
  for (const sb of snowballs){ sb.x -= SNOW_ZONE.speed; sb.spin += 0.22; }
  if (snowballs.length) snowballs = snowballs.filter(sb => sb.x > SNOW_ZONE.x0 - 140);
}

function updateIcicles(){
  for (const ic of ICICLES){
    ic.t++;
    if (ic.falling){
      ic.vy += 0.5; ic.y += ic.vy;
      if (ic.y > GROUND_Y - 30){
        // shatter on the cave floor and start growing back
        for (let i = 0; i < 7; i++){
          shards.push({ x: ic.x, y: GROUND_Y - 10,
            vx:(Math.random()-0.5)*4, vy:-1.5 - Math.random()*2.5,
            life:0, max:22 + Math.random()*10, r:2 + Math.random()*3 });
        }
        if (Math.abs(player.x - ic.x) < 700) sfx.shatter();
        ic.falling = false; ic.y = ICICLE_TOP; ic.vy = 0; ic.t = 0;
      }
    } else if (ic.t > ICICLE_PERIOD){
      ic.falling = true; ic.vy = 0;
    }
  }
}

function updateMelts(){
  for (const m of MELTS){
    if (m.broken){
      m.regrow--;
      if (m.regrow <= 0){ m.broken = false; m.timer = -1; }
    } else if (m.timer > 0){
      m.timer--;
      if (m.timer === 0){
        m.broken = true; m.regrow = MELT_REGROW;
        sfx.shatter();
        for (let i = 0; i < 10; i++){
          shards.push({ x: m.x + Math.random()*m.w, y: m.y + 10,
            vx:(Math.random()-0.5)*3, vy: Math.random()*1.5,
            life:0, max:26 + Math.random()*10, r:2.5 + Math.random()*3 });
        }
      }
    }
  }
}

function updateShards(){
  for (const sh of shards){ sh.x += sh.vx; sh.y += sh.vy; sh.vy += 0.28; sh.life++; }
  if (shards.length) shards = shards.filter(sh => sh.life < sh.max);
}

// ------------------------------------------------------------------
// Update dispatch
// ------------------------------------------------------------------
function update(){
  tGlobal++;
  gecko.anim += 0.25;
  if (state === "playing" || state === "race") runMs += 1000/60;

  // particles drift and fade
  for (const p of inkParts){ p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life++; }
  if (inkParts.length) inkParts = inkParts.filter(p => p.life < p.max);

  if (state === "playing" || state === "countdown" || state === "race"){
    updateLogs();
    updateVolcano();
    updateSnow();
    updateIcicles();
    updateMelts();
    updateShards();
  }

  if (state === "playing"){
    updatePlayer(true);
    if (!raceStarted && player.x >= START_LINE){
      raceStarted = true;
      state = "countdown";
      countdownTimer = 50; countdownStep = 3;
      gecko.x = player.x; gecko.y = GROUND_Y - gecko.h;   // fair start, same spot
      sfx.count();
    }
  } else if (state === "countdown"){
    updatePlayer(false); // settle, no input
    countdownTimer--;
    if (countdownTimer <= 0){
      countdownStep--;
      if (countdownStep > 0){ countdownTimer = 50; sfx.count(); }
      else if (countdownStep === 0){ countdownTimer = 40; sfx.go(); }
      else { state = "race"; gecko.x = player.x; }
    }
  } else if (state === "race"){
    updatePlayer(true);
    let gs;
    if (player.ch.dash){
      // octopus: the gecko is faster than your walk — you MUST ink-dash to win
      gs = 1.1 * player.ch.run;
    } else {
      // others: the gecko runs at 0.9x your speed, then sprints to 1.1x near the line
      const base = 0.9 * player.ch.run;
      const top  = 1.1 * player.ch.run;
      const distLeft = FINISH_LINE - (gecko.x + gecko.w);
      gs = base;
      if (distLeft < 320){
        const t = Math.max(0, 1 - distLeft / 320);
        gs = base + (top - base) * t;
      }
    }
    gecko.x += gs;
    if (player.x + player.w >= FINISH_LINE){
      state = "win"; sfx.win();
      lastTime = runMs;
      lastRank = Leaderboard.add(runMs, player.ch);
      if (lastRank >= 0) setTimeout(() => sfx.record(), 400);
    }
    else if (gecko.x + gecko.w >= FINISH_LINE){ state = "lose"; sfx.lose(); }
  }

  // camera
  if (playing()){
    let target = player.x + player.w/2 - W/2 + 60;
    cameraX += (target - cameraX) * 0.12;
    cameraX = Math.max(0, Math.min(WORLD_END - W, cameraX));
  }

  jumpBuffer = Math.max(0, jumpBuffer - 1);
}

// ------------------------------------------------------------------
// Menu / state input handling (edges + taps)
// ------------------------------------------------------------------
function handleEdges(){
  if (toastT > 0) toastT--;
  if (muteEdge){ muted = !muted; muteEdge = false; }
  if (uiTap === "mute"){ muted = !muted; uiTap = null; }
  if (resetEdge || uiTap === "reset"){
    // on the scores page this clears the level being shown, otherwise the one in play
    Leaderboard.resetKey(state === "scores" ? LEVELS[scoresLevel].scoreKey : Leaderboard.KEY);
    lastRank = -1; setToast(T("High scores cleared!")); sfx.check();
    resetEdge = false; if (uiTap === "reset") uiTap = null;
  }

  if (uiTap === "lang"){ setLang(LANG === "es" ? "en" : "es"); sfx.select(); uiTap = null; }

  const confirm = confirmEdge || uiTap === "play" || uiTap === "go" || uiTap === "again";
  const wantScores = scoresEdge || uiTap === "scores";
  const back = uiTap === "back";

  // a high-scores button on a level card carries that level's index
  if (uiTap && uiTap.startsWith("hs")){
    scoresLevel = +uiTap.slice(2);
    scoresFrom = "levels"; state = "scores"; sfx.select();
    uiTap = null;
  }

  if (state === "title"){
    if (confirm){ state = "levels"; sfx.select(); }
  } else if (state === "levels"){
    if (leftEdge){ levelIndex = (levelIndex - 1 + LEVELS.length) % LEVELS.length; sfx.select(); }
    if (rightEdge){ levelIndex = (levelIndex + 1) % LEVELS.length; sfx.select(); }
    if (uiTap && uiTap.startsWith("lvl")){ levelIndex = +uiTap.slice(3); sfx.select(); }
    else if (back){ state = "title"; sfx.select(); }
    else if (confirm){
      if (LEVELS[levelIndex].comingSoon){
        setToast(T("The Icy Way is still being built!"));
        sfx.bump();
      } else {
        loadLevel(levelIndex); pickIndex = 0; state = "pick"; sfx.select();
      }
    }
  } else if (state === "scores"){
    if (confirm || back || wantScores){ state = scoresFrom; sfx.select(); }
  } else if (state === "pick"){
    if (leftEdge || uiTap === "prev"){ pickIndex = (pickIndex - 1 + CHARS.length) % CHARS.length; sfx.select(); }
    if (rightEdge || uiTap === "next"){ pickIndex = (pickIndex + 1) % CHARS.length; sfx.select(); }
    if (uiTap && uiTap.startsWith("card")){ pickIndex = +uiTap.slice(4); sfx.select(); }
    else if (back){ state = "levels"; sfx.select(); }
    else if (confirm){ resetPlayer(CHARS[pickIndex]); state = "playing"; sfx.go(); }
    else if (wantScores){ scoresLevel = levelIndex; scoresFrom = "pick"; state = "scores"; sfx.select(); }
  } else if (playing()){
    if (pauseEdge){ prevState = state; state = "paused"; }
  } else if (state === "paused"){
    if (pauseEdge || confirm || uiTap === "resume"){ state = prevState; }
  } else if (state === "win" || state === "lose"){
    if (wantScores){ scoresLevel = levelIndex; scoresFrom = "pick"; state = "scores"; sfx.select(); }
    else if (uiTap === "levels"){ state = "levels"; sfx.select(); }
    else if (confirm || leftEdge || rightEdge){ state = "pick"; sfx.select(); }
  }

  confirmEdge = leftEdge = rightEdge = pauseEdge = scoresEdge = false;
  uiTap = null;
}

// ------------------------------------------------------------------
// Rendering helpers
// ------------------------------------------------------------------
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function worldX(x){ return x - cameraX; }
function centerText(text, y, size, color="#fff", weight="bold"){
  ctx.fillStyle = color; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `${weight} ${size}px 'Comic Sans MS', sans-serif`;
  ctx.fillText(text, W/2, y);
}
function dim(alpha){ ctx.fillStyle = `rgba(${THEME.dimTint},${alpha})`; ctx.fillRect(0,0,W,H); }
function formatTime(ms){
  const s = ms/1000, m = Math.floor(s/60), sec = s - m*60;
  return m + ":" + (sec < 10 ? "0" : "") + sec.toFixed(1);
}

// ------------------------------------------------------------------
// World rendering
// ------------------------------------------------------------------
function drawBackground(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,THEME.skyTop); g.addColorStop(0.55,THEME.skyMid); g.addColorStop(1,THEME.skyBottom);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // far hills
  ctx.fillStyle = THEME.hillFar;
  for (let i=-1;i<9;i++){
    const hx = i*380 - (cameraX*0.25 % 380);
    ctx.beginPath();
    ctx.arc(hx+150, GROUND_Y+30, 210, Math.PI, 0);
    ctx.fill();
  }
  ctx.fillStyle = THEME.hillNear;
  for (let i=-1;i<11;i++){
    const hx = i*280 - (cameraX*0.45 % 280);
    ctx.beginPath();
    ctx.arc(hx+110, GROUND_Y+65, 155, Math.PI, 0);
    ctx.fill();
  }

  // leafy canopy along the top of the screen, with hanging vines
  ctx.fillStyle = THEME.canopy;
  for (let i=-1;i<13;i++){
    const cx = i*160 - (cameraX*0.15 % 160);
    ctx.beginPath();
    ctx.arc(cx+60, 6, 62, 0, Math.PI);
    ctx.fill();
  }
  if (THEME.trees === "pine"){
    // icicles hanging off the snowy overhang instead of jungle vines
    for (let i=0;i<14;i++){
      const vx = i*160 - (cameraX*0.15 % 160) + 30;
      const len = 30 + (i%5)*22;
      ctx.fillStyle = THEME.vineLeaf;
      ctx.beginPath();
      ctx.moveTo(vx - 8, 14); ctx.lineTo(vx + 8, 14); ctx.lineTo(vx, 14 + len);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.beginPath();
      ctx.moveTo(vx - 3, 18); ctx.lineTo(vx + 1, 18); ctx.lineTo(vx - 1, 18 + len*0.55);
      ctx.closePath(); ctx.fill();
    }
    ctx.lineCap = "butt";
    return;
  }
  ctx.strokeStyle = THEME.vine; ctx.lineWidth = 5; ctx.lineCap = "round";
  for (let i=0;i<10;i++){
    const vx = i*230 - (cameraX*0.15 % 230) + 40;
    const len = 60 + (i%4)*46;
    const sway = Math.sin(tGlobal*0.02 + i)*10;
    ctx.beginPath();
    ctx.moveTo(vx, 20);
    ctx.quadraticCurveTo(vx + sway, 20 + len*0.6, vx + sway*1.6, 20 + len);
    ctx.stroke();
    ctx.fillStyle = THEME.vineLeaf;
    ctx.beginPath();
    ctx.ellipse(vx + sway*1.6, 22 + len, 7, 13, sway*0.02, 0, 7);
    ctx.fill();
  }
  ctx.lineCap = "butt";
}

function drawTrees(){
  for (let i=0;i<TREES.length;i++){
    const x = worldX(TREES[i].x);
    if (x < -110 || x > W+110) continue;
    if (CAVE && TREES[i].x > CAVE.x0 - 60 && TREES[i].x < CAVE.x1 + 60) continue;
    const bend = Math.sin(tGlobal*0.02 + i)*4;
    if (THEME.trees === "pine"){
      // snowy pine
      ctx.fillStyle = "#6b4a34";
      ctx.fillRect(x - 7, GROUND_Y - 46, 14, 46);
      for (let tier = 0; tier < 3; tier++){
        const ty = GROUND_Y - 58 - tier*38;
        const half = 54 - tier*13;
        ctx.fillStyle = tier % 2 ? "#2f6b48" : "#387a52";
        ctx.beginPath();
        ctx.moveTo(x + bend*(tier+1)*0.3, ty - 52);
        ctx.lineTo(x + half, ty);
        ctx.lineTo(x - half, ty);
        ctx.closePath(); ctx.fill();
        // snow cap on each tier
        ctx.fillStyle = "#f4faff";
        ctx.beginPath();
        ctx.moveTo(x + bend*(tier+1)*0.3, ty - 52);
        ctx.lineTo(x + half*0.55, ty - 18);
        ctx.lineTo(x - half*0.55, ty - 18);
        ctx.closePath(); ctx.fill();
      }
      continue;
    }
    // jungle palm
    ctx.strokeStyle = "#7b5230"; ctx.lineWidth = 14; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y);
    ctx.quadraticCurveTo(x + bend, GROUND_Y-70, x + bend*2, GROUND_Y-130);
    ctx.stroke();
    const tx = x + bend*2, ty = GROUND_Y-130;
    ctx.fillStyle = i % 3 === 1 ? "#3f8f3a" : "#4fa347";
    for (let f=0; f<6; f++){
      const ang = Math.PI + (f/5)*Math.PI;
      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(ang + Math.sin(tGlobal*0.02 + f)*0.05);
      ctx.beginPath();
      ctx.ellipse(46, 0, 46, 15, 0, 0, 7);
      ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = "#c8862f";
    ctx.beginPath(); ctx.arc(tx, ty+6, 8, 0, 7); ctx.fill();
    ctx.lineCap = "butt";
  }
}

function drawSolid(s){
  const x = worldX(s.x), y = s.y;
  if (x + s.w < -60 || x > W+60) return;
  if (s.type === "ground"){
    ctx.fillStyle = THEME.dirt;
    ctx.fillRect(x, y, s.w, s.h);
    ctx.fillStyle = THEME.grass;
    ctx.fillRect(x, y, s.w, 14);
    ctx.fillStyle = THEME.grassDark;
    for (let gx = (Math.floor(cameraX/24)*24 - cameraX); gx < W; gx += 24){
      if (gx >= x && gx <= x + s.w) ctx.fillRect(gx, y+10, 3, 6);
    }
  } else if (s.type === "wall"){
    // bamboo hurdle
    ctx.fillStyle = "#b6d24a"; rr(x,y,s.w,s.h,6); ctx.fill();
    ctx.strokeStyle = "#7c9a24"; ctx.lineWidth = 3;
    for (let i=16;i<s.h;i+=24){ ctx.beginPath(); ctx.moveTo(x,y+i); ctx.lineTo(x+s.w,y+i); ctx.stroke(); }
    rr(x,y,s.w,s.h,6); ctx.stroke();
  } else if (s.type === "web"){
    // spider-web trampoline
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
    const cx = x + s.w/2, cy = y + s.h/2, squish = Math.sin(tGlobal*0.15)*2;
    for (let i=0;i<=6;i++){
      const px = x + (s.w/6)*i;
      ctx.beginPath(); ctx.moveTo(px, y - 12 + squish); ctx.lineTo(cx, y + s.h + 8); ctx.stroke();
    }
    for (let r=1;r<=3;r++){
      ctx.beginPath();
      for (let i=0;i<=6;i++){
        const px = x + (s.w/6)*i;
        const t = r/4;
        const qx = px + (cx-px)*t, qy = (y-12+squish) + ((y+s.h+8)-(y-12+squish))*t;
        if (i===0) ctx.moveTo(qx,qy); else ctx.lineTo(qx,qy);
      }
      ctx.stroke();
    }
    ctx.fillStyle = "#3b3b3b";
    ctx.beginPath(); ctx.arc(cx + 34, y - 6, 7, 0, 7); ctx.fill();
  } else if (s.type === "volcano"){
    // volcano cone
    ctx.fillStyle = "#6b5142";
    ctx.beginPath();
    ctx.moveTo(x - 34, y + s.h);
    ctx.lineTo(x + s.w*0.22, y);
    ctx.lineTo(x + s.w*0.78, y);
    ctx.lineTo(x + s.w + 34, y + s.h);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#8a6a58";
    ctx.beginPath();
    ctx.moveTo(x + s.w*0.22, y); ctx.lineTo(x + s.w*0.78, y);
    ctx.lineTo(x + s.w*0.66, y+16); ctx.lineTo(x + s.w*0.34, y+16);
    ctx.closePath(); ctx.fill();
    // glowing crater — it swells and brightens just before an eruption
    const warn = eruptTimer < ERUPT_WARN ? 1 - eruptTimer / ERUPT_WARN : 0;
    const grow = warn * 8;
    ctx.fillStyle = warn > 0 ? ((tGlobal >> 2) % 2 ? "#fff0a0" : "#ff5a1e") : "#ff8b2b";
    rr(x + s.w*0.3 - grow, y - 4 - grow*0.5, s.w*0.4 + grow*2, 12 + grow, 6); ctx.fill();
    if (warn > 0){
      ctx.save();
      ctx.globalAlpha = warn * 0.5;
      ctx.fillStyle = "#ff8b2b";
      ctx.beginPath();
      ctx.arc(x + s.w/2, y, 26 + warn*16, 0, 7);
      ctx.fill();
      ctx.restore();
    }
    for (let i=0;i<4;i++){
      const t = (tGlobal*0.6 + i*40) % 160;
      ctx.fillStyle = "rgba(190,190,190," + (0.35 * (1 - t/160)).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(x + s.w/2 + Math.sin(t*0.05 + i)*22, y - 14 - t*0.55, 12 + t*0.09, 0, 7);
      ctx.fill();
    }
  } else if (s.type === "melt"){
    if (s.broken){
      // ghost outline showing where it will freeze back
      ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 2;
      ctx.setLineDash([7, 7]);
      rr(x, y, s.w, s.h, 6); ctx.stroke();
      ctx.setLineDash([]);
      return;
    }
    const cracking = s.timer > 0;
    const shake = cracking && s.timer < 60 ? Math.sin(tGlobal*0.9)*2 : 0;
    ctx.save();
    ctx.translate(shake, 0);
    // pillar under the ice cap, like Mateo drew them
    ctx.fillStyle = "#9fc8e2";
    ctx.fillRect(x + s.w/2 - 13, y + s.h, 26, GROUND_Y - (y + s.h));
    ctx.fillStyle = cracking ? "#dbeefb" : "#eaf6ff";
    rr(x, y, s.w, s.h, 7); ctx.fill();
    ctx.strokeStyle = "#6fa8cc"; ctx.lineWidth = 3;
    rr(x, y, s.w, s.h, 7); ctx.stroke();
    if (cracking){
      // cracks spread as the three seconds run out
      const f = 1 - s.timer / MELT_TIME;
      ctx.strokeStyle = "rgba(60,110,150," + (0.35 + f*0.55).toFixed(2) + ")";
      ctx.lineWidth = 2;
      for (let i = 1; i <= 3; i++){
        const cx2 = x + (s.w/4)*i;
        ctx.beginPath();
        ctx.moveTo(cx2, y + 2);
        ctx.lineTo(cx2 - 7*f, y + s.h/2);
        ctx.lineTo(cx2 + 6*f, y + s.h - 2);
        ctx.stroke();
      }
      // countdown pips
      const left = Math.ceil(s.timer / 60);
      for (let i = 0; i < 3; i++){
        ctx.fillStyle = i < left ? "#2f7fc4" : "rgba(80,120,150,0.3)";
        ctx.beginPath(); ctx.arc(x + s.w/2 - 16 + i*16, y - 12, 4.5, 0, 7); ctx.fill();
      }
    }
    ctx.restore();
  } else if (s.type === "iceblock"){
    ctx.fillStyle = "#cfe8f7";
    rr(x, y, s.w, s.h, 6); ctx.fill();
    ctx.fillStyle = "#eaf6ff";
    ctx.fillRect(x + 3, y + 3, s.w - 6, 10);
    ctx.strokeStyle = "#6fa8cc"; ctx.lineWidth = 3;
    rr(x, y, s.w, s.h, 6); ctx.stroke();
    // block seams
    ctx.strokeStyle = "rgba(111,168,204,0.55)"; ctx.lineWidth = 2;
    for (let by = y + 50; by < y + s.h; by += 50){
      ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x + s.w, by); ctx.stroke();
    }
  } else if (s.type === "leaf"){
    // big floating leaf you hop over
    const bob = Math.sin(tGlobal*0.05 + s.x)*3;
    ctx.fillStyle = "#4fa347";
    ctx.beginPath();
    ctx.ellipse(x + s.w/2, y + s.h/2 + bob, s.w/2, s.h/2, 0, 0, 7);
    ctx.fill();
    ctx.strokeStyle = "#2f7a2c"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 6, y + s.h/2 + bob); ctx.lineTo(x + s.w - 6, y + s.h/2 + bob);
    ctx.stroke();
    ctx.lineWidth = 2;
    for (let i=1;i<4;i++){
      const lx = x + (s.w/4)*i;
      ctx.beginPath();
      ctx.moveTo(lx, y + s.h/2 + bob);
      ctx.lineTo(lx + 10, y + 8 + bob);
      ctx.moveTo(lx, y + s.h/2 + bob);
      ctx.lineTo(lx + 10, y + s.h - 8 + bob);
      ctx.stroke();
    }
  }
}

function drawWater(){
  for (const wt of WATERS){
    const x = worldX(wt.x), y = GROUND_Y - WATER_H;
    if (x + wt.w < -40 || x > W+40) continue;
    if (THEME.refill === "ice"){
      // sheet ice: the fish tops up on this instead of water
      ctx.fillStyle = "rgba(214,240,253,0.92)";
      ctx.fillRect(x, y, wt.w, WATER_H + 14);
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.fillRect(x, y, wt.w, 5);
      ctx.strokeStyle = "rgba(120,180,215,0.65)"; ctx.lineWidth = 2;
      for (let i = 18; i < wt.w - 8; i += 46){
        ctx.beginPath();
        ctx.moveTo(x+i, y+9); ctx.lineTo(x+i+16, y+19); ctx.lineTo(x+i+7, y+29);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      for (let i=0;i<3;i++){
        const sx = x + ((i*67 + tGlobal*0.5) % Math.max(20, wt.w));
        ctx.beginPath(); ctx.arc(sx, y + 12 + Math.sin(tGlobal*0.07+i)*3, 2.2, 0, 7); ctx.fill();
      }
      continue;
    }
    ctx.fillStyle = THEME.water;
    ctx.fillRect(x, y, wt.w, WATER_H + 14);
    ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i=0;i<wt.w;i+=20){
      const wob = Math.sin(tGlobal*0.09 + (wt.x+i)*0.05)*2.5;
      ctx.moveTo(x+i, y+4+wob);
      ctx.quadraticCurveTo(x+i+10, y-2+wob, x+i+20, y+4+wob);
    }
    ctx.stroke();
    // sparkles so the pools read as friendly, not deadly
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    for (let i=0;i<3;i++){
      const sx = x + ((i*57 + tGlobal*0.6) % Math.max(20, wt.w));
      ctx.beginPath(); ctx.arc(sx, y + 14 + Math.sin(tGlobal*0.07+i)*4, 2, 0, 7); ctx.fill();
    }
  }
}

function drawHazard(hz){
  const x = worldX(hz.x), y = hz.y;
  if (x + hz.w < -60 || x > W+60) return;
  if (hz.kind === "quicksand"){
    ctx.fillStyle = "#c9a86b";
    rr(x, y, hz.w, hz.h + 10, 5); ctx.fill();
    ctx.strokeStyle = "#8d7442"; ctx.lineWidth = 2.5;
    for (let i=0;i<3;i++){
      const sy = y + 6 + i*6;
      const off = Math.sin(tGlobal*0.06 + i)*6;
      ctx.beginPath();
      ctx.moveTo(x + 8 + off, sy);
      ctx.lineTo(x + hz.w - 8 + off*0.5, sy);
      ctx.stroke();
    }
    // sinking bubbles
    ctx.fillStyle = "rgba(120,95,50,0.55)";
    for (let i=0;i<2;i++){
      const bx = x + 18 + ((i*41 + tGlobal*0.4) % Math.max(20, hz.w - 36));
      ctx.beginPath(); ctx.arc(bx, y + 4 + Math.sin(tGlobal*0.1+i)*2, 3.5, 0, 7); ctx.fill();
    }
  } else if (hz.kind === "poison"){
    ctx.fillStyle = "rgba(126,62,168,0.85)";
    ctx.fillRect(x, y, hz.w, hz.h);
    ctx.strokeStyle = "rgba(190,255,120,0.85)"; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i=0;i<hz.w;i+=18){
      const wob = Math.sin(tGlobal*0.12 + i*0.1)*3;
      ctx.moveTo(x+i, y+5+wob);
      ctx.quadraticCurveTo(x+i+9, y-3+wob, x+i+18, y+5+wob);
    }
    ctx.stroke();
    ctx.fillStyle = "rgba(190,255,120,0.7)";
    for (let i=0;i<4;i++){
      const bx = x + 12 + ((i*29 + tGlobal*0.5) % Math.max(20, hz.w - 24));
      const by = y + hz.h - ((tGlobal*1.1 + i*37) % hz.h);
      ctx.beginPath(); ctx.arc(bx, by, 3 + (i%2), 0, 7); ctx.fill();
    }
  } else if (hz.kind === "fire"){
    // logs plus dancing flames
    ctx.fillStyle = "#7b5230";
    ctx.save(); ctx.translate(x + hz.w/2, y + hz.h - 8);
    ctx.rotate(0.3); ctx.fillRect(-hz.w/2, -5, hz.w, 10);
    ctx.rotate(-0.6); ctx.fillRect(-hz.w/2, -5, hz.w, 10);
    ctx.restore();
    for (let i = 0; i < 3; i++){
      const fx = x + hz.w/2 + (i-1)*13;
      const fl = 22 + Math.sin(tGlobal*0.25 + i*1.7)*8;
      ctx.fillStyle = ["#ff5a1e","#ff8b2b","#ffd24d"][i];
      ctx.beginPath();
      ctx.moveTo(fx, y + hz.h - 14 - fl);
      ctx.quadraticCurveTo(fx + 11, y + hz.h - 18, fx + 7, y + hz.h - 12);
      ctx.quadraticCurveTo(fx, y + hz.h - 6, fx - 7, y + hz.h - 12);
      ctx.quadraticCurveTo(fx - 11, y + hz.h - 18, fx, y + hz.h - 14 - fl);
      ctx.fill();
    }
  } else if (hz.kind === "icecube"){
    ctx.fillStyle = "rgba(210,238,252,0.92)";
    rr(x, y, hz.w, hz.h, 7); ctx.fill();
    ctx.strokeStyle = "#6fa8cc"; ctx.lineWidth = 3;
    rr(x, y, hz.w, hz.h, 7); ctx.stroke();
    // shine
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    rr(x + 8, y + 7, 13, 6, 3); ctx.fill();
    ctx.strokeStyle = "rgba(111,168,204,0.5)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + hz.w - 12, y + 9); ctx.lineTo(x + hz.w - 12, y + hz.h - 9); ctx.stroke();
  } else if (hz.kind === "icespike"){
    ctx.fillStyle = "#8fd4f5";
    const n = 3;
    ctx.beginPath();
    for (let i = 0; i < n; i++){
      const sx = x + i*(hz.w/n);
      ctx.moveTo(sx, y + hz.h);
      ctx.lineTo(sx + hz.w/(2*n), y);
      ctx.lineTo(sx + hz.w/n, y + hz.h);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#3f86b8"; ctx.lineWidth = 2; ctx.stroke();
  } else if (hz.kind === "freeze"){
    ctx.fillStyle = "rgba(60,120,190,0.72)";
    ctx.fillRect(x, y, hz.w, hz.h);
    ctx.strokeStyle = "rgba(220,245,255,0.8)"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i < hz.w; i += 24){
      const wob = Math.sin(tGlobal*0.07 + i*0.05)*3;
      ctx.moveTo(x+i, y+5+wob);
      ctx.quadraticCurveTo(x+i+12, y-3+wob, x+i+24, y+5+wob);
    }
    ctx.stroke();
    // floating ice floes
    ctx.fillStyle = "rgba(235,250,255,0.85)";
    for (let i = 0; i < 5; i++){
      const fx = x + 40 + ((i*173 + tGlobal*0.25) % Math.max(40, hz.w - 80));
      rr(fx, y + 6 + Math.sin(tGlobal*0.05+i)*3, 40, 9, 4); ctx.fill();
    }
  } else if (hz.kind === "hole"){
    // a hole punched clean through the ice rink
    ctx.fillStyle = "#123b5c";
    ctx.beginPath(); ctx.ellipse(x + hz.w/2, y + hz.h/2, hz.w/2, hz.h/2 + 4, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "#dceefb"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(x + hz.w/2, y + hz.h/2, hz.w/2, hz.h/2 + 4, 0, 0, 7); ctx.stroke();
    ctx.fillStyle = "rgba(90,170,220,0.65)";
    ctx.beginPath(); ctx.ellipse(x + hz.w/2, y + hz.h/2 + 3, hz.w/2 - 8, hz.h/2 - 2, 0, 0, 7); ctx.fill();
  } else if (hz.kind === "cloud" || hz.kind === "lowleaf"){
    if (hz.kind === "cloud"){
      // a heavy low snow cloud — duck under it
      const bob = Math.sin(tGlobal*0.04 + hz.x)*4;
      ctx.fillStyle = "#b9cfe0";
      ctx.beginPath();
      ctx.arc(x + 24, y + hz.h - 20 + bob, 24, 0, 7);
      ctx.arc(x + hz.w/2, y + hz.h - 30 + bob, 30, 0, 7);
      ctx.arc(x + hz.w - 24, y + hz.h - 20 + bob, 24, 0, 7);
      ctx.fill();
      ctx.fillStyle = "#d8e8f4";
      ctx.beginPath();
      ctx.arc(x + 34, y + hz.h - 32 + bob, 15, 0, 7);
      ctx.arc(x + hz.w - 34, y + hz.h - 30 + bob, 12, 0, 7);
      ctx.fill();
      // a little snow falling out of it
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      for (let i = 0; i < 4; i++){
        const sx = x + 18 + i*((hz.w - 36)/3);
        const sy = y + hz.h - 6 + ((tGlobal*1.4 + i*23) % 26);
        ctx.beginPath(); ctx.arc(sx, sy, 2.4, 0, 7); ctx.fill();
      }
      return;
    }
    // heavy leaf cluster hanging from a vine — duck under it
    const bob = Math.sin(tGlobal*0.045 + hz.x)*3;
    ctx.strokeStyle = "#397d3a"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x + hz.w/2, 0); ctx.lineTo(x + hz.w/2, y + 10 + bob); ctx.stroke();
    ctx.fillStyle = "#2f6b31";
    for (let i=0;i<4;i++){
      const lx = x + 14 + i*((hz.w - 28)/3);
      ctx.beginPath();
      ctx.ellipse(lx, y + hz.h - 16 + bob, 20, 26, (i-1.5)*0.35, 0, 7);
      ctx.fill();
    }
    ctx.fillStyle = "#4fa347";
    for (let i=0;i<3;i++){
      const lx = x + 24 + i*((hz.w - 48)/2);
      ctx.beginPath();
      ctx.ellipse(lx, y + hz.h - 24 + bob, 15, 20, (i-1)*0.4, 0, 7);
      ctx.fill();
    }
  }
}

function drawLogs(){
  for (const l of logs){
    const x = worldX(l.x);
    if (x + LOG_ZONE.w < -40 || x > W+40) continue;
    const cx = x + LOG_ZONE.w/2, cy = l.y + LOG_ZONE.h/2;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath(); ctx.ellipse(cx, GROUND_Y + 2, LOG_ZONE.w*0.44, 6, 0, 0, 7); ctx.fill();
    ctx.translate(cx, cy);
    ctx.rotate(-l.x * 0.035);   // rolls as it travels
    ctx.fillStyle = "#8a5f34";
    rr(-LOG_ZONE.w/2, -LOG_ZONE.h/2, LOG_ZONE.w, LOG_ZONE.h, LOG_ZONE.h/2); ctx.fill();
    ctx.strokeStyle = "#5f4020"; ctx.lineWidth = 3;
    rr(-LOG_ZONE.w/2, -LOG_ZONE.h/2, LOG_ZONE.w, LOG_ZONE.h, LOG_ZONE.h/2); ctx.stroke();
    // end rings
    ctx.fillStyle = "#c08b52";
    ctx.beginPath(); ctx.ellipse(-LOG_ZONE.w/2 + 11, 0, 8, LOG_ZONE.h/2 - 4, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "#5f4020"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(-LOG_ZONE.w/2 + 11, 0, 4, LOG_ZONE.h/2 - 10, 0, 0, 7); ctx.stroke();
    ctx.restore();
  }
}

function drawFireballs(){
  for (const f of fireballs){
    const x = worldX(f.x);
    if (x < -60 || x > W+60) continue;
    ctx.save();
    // smoky trail
    for (let i = 1; i <= 3; i++){
      ctx.globalAlpha = 0.26 / i;
      ctx.fillStyle = "#ff7a1e";
      ctx.beginPath();
      ctx.arc(x - f.vx*i*2.2, f.y - f.vy*i*2.2, FIRE_R * (1 - i*0.16), 0, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // outer flame
    ctx.fillStyle = "#ff5a1e";
    ctx.beginPath(); ctx.arc(x, f.y, FIRE_R + 3, 0, 7); ctx.fill();
    // hot core, wobbling so it reads as fire
    ctx.fillStyle = "#ffb020";
    ctx.beginPath(); ctx.arc(x, f.y, FIRE_R - 1 + Math.sin(f.spin)*1.5, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff0a0";
    ctx.beginPath(); ctx.arc(x - 1, f.y - 2, FIRE_R*0.45, 0, 7); ctx.fill();
    ctx.restore();
  }
}

function drawSnowballs(){
  for (const sb of snowballs){
    const x = worldX(sb.x);
    if (x < -60 || x > W+60) continue;
    ctx.save();
    // motion streaks, like Mateo drew
    ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 3; ctx.lineCap = "round";
    for (let i = 0; i < 3; i++){
      ctx.beginPath();
      ctx.moveTo(x + SNOW_R + 8, sb.y - 8 + i*8);
      ctx.lineTo(x + SNOW_R + 22 + i*7, sb.y - 8 + i*8);
      ctx.stroke();
    }
    ctx.lineCap = "butt";
    ctx.translate(x, sb.y);
    ctx.rotate(sb.spin);
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(0, 0, SNOW_R, 0, 7); ctx.fill();
    ctx.strokeStyle = "#a8c8dd"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, SNOW_R, 0, 7); ctx.stroke();
    ctx.fillStyle = "#dcecf7";
    ctx.beginPath(); ctx.arc(-4, 4, 5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -3, 3.5, 0, 7); ctx.fill();
    ctx.restore();
  }
}

function drawIcicles(){
  for (const ic of ICICLES){
    const x = worldX(ic.x);
    if (x < -50 || x > W+50) continue;
    const ready = !ic.falling && ic.t > ICICLE_PERIOD - 35;
    const shake = ready ? Math.sin(tGlobal*1.1)*2.5 : 0;
    ctx.save();
    ctx.translate(x + shake, ic.y);
    ctx.fillStyle = ready ? "#bfe8ff" : "#9fd6f2";
    ctx.beginPath();
    ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.lineTo(0, 46);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#4f95c4"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath();
    ctx.moveTo(-3.5, 4); ctx.lineTo(0.5, 4); ctx.lineTo(-1, 28);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawShards(){
  for (const sh of shards){
    const f = sh.life / sh.max;
    ctx.fillStyle = "rgba(225,245,255," + ((1-f)*0.9).toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(worldX(sh.x), sh.y, sh.r, 0, 7); ctx.fill();
  }
}

// the frozen cave the ice rink sits inside
function drawCave(){
  if (!CAVE) return;
  const x0 = worldX(CAVE.x0), x1 = worldX(CAVE.x1);
  if (x1 < -80 || x0 > W+80) return;
  ctx.save();
  ctx.beginPath();
  ctx.rect(Math.max(-80, x0), 0, Math.min(W+80, x1) - Math.max(-80, x0), GROUND_Y);
  ctx.clip();
  // rock wall behind everything
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, "#2b3d4f"); g.addColorStop(1, "#4a6277");
  ctx.fillStyle = g; ctx.fillRect(-100, 0, W+200, GROUND_Y);
  // a lumpy roof with hanging stalactites
  ctx.fillStyle = "#22333f";
  ctx.beginPath();
  ctx.moveTo(-100, 0); ctx.lineTo(W+100, 0); ctx.lineTo(W+100, 96);
  for (let i = 12; i >= 0; i--){
    const sx = -100 + i*((W+200)/12);
    ctx.lineTo(sx + 40, 96 + (i%2 ? 40 : 14));
    ctx.lineTo(sx, 96);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
  // frosty mouths at each end
  for (const [mx, dir] of [[x0, 1], [x1, -1]]){
    if (mx < -140 || mx > W+140) continue;
    ctx.save();
    ctx.fillStyle = "#1c2b36";
    ctx.beginPath();
    ctx.moveTo(mx, GROUND_Y);
    ctx.quadraticCurveTo(mx, 150, mx + dir*70, 150);
    ctx.lineTo(mx + dir*70, GROUND_Y);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#d8ecfa"; ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(mx, GROUND_Y);
    ctx.quadraticCurveTo(mx, 150, mx + dir*70, 150);
    ctx.stroke();
    ctx.restore();
  }
}

function drawSigns(){
  ctx.save();
  ctx.textAlign = "center";
  for (const sg of SIGNS){
    const x = worldX(sg.x);
    if (x < -160 || x > W+160) continue;
    ctx.fillStyle = "#8a5a2b";
    ctx.fillRect(x-3, GROUND_Y-70, 6, 70);
    // measure the translated text so longer Spanish signs still fit the board
    const label = T(sg.text);
    ctx.font = "bold 15px 'Comic Sans MS', sans-serif";
    const w = Math.max(90, ctx.measureText(label).width + 24);
    ctx.fillStyle = "#f7e2b0";
    rr(x-w/2, GROUND_Y-110, w, 40, 8); ctx.fill();
    ctx.strokeStyle = "#8a5a2b"; ctx.lineWidth=3;
    rr(x-w/2, GROUND_Y-110, w, 40, 8); ctx.stroke();
    ctx.fillStyle = "#5a3a16";
    ctx.fillText(label, x, GROUND_Y-84);
  }
  ctx.restore();
}

function drawCheckpoints(){
  for (let i=0;i<CHECKPOINTS.length;i++){
    const c = CHECKPOINTS[i];
    const x = worldX(c.tx);
    if (x < -40 || x > W+40) continue;
    const reached = player.reachedCheck >= i;
    ctx.strokeStyle = "#5a4a3a"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, GROUND_Y); ctx.lineTo(x, GROUND_Y-60); ctx.stroke();
    ctx.fillStyle = reached ? "#41c75a" : "#e6b800";
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y-60); ctx.lineTo(x+26, GROUND_Y-50); ctx.lineTo(x, GROUND_Y-40);
    ctx.closePath(); ctx.fill();
  }
}

function drawStartFinish(){
  let x = worldX(START_LINE);
  if (x > -20 && x < W+20){
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fillRect(x-2, GROUND_Y-120, 4, 120);
  }
  x = worldX(FINISH_LINE);
  if (x > -60 && x < W+60){
    ctx.fillStyle = "#333"; ctx.fillRect(x-4, GROUND_Y-150, 8, 150);
    const bw=70, bh=40, sq=10;
    for (let r=0;r<bh/sq;r++) for (let c=0;c<bw/sq;c++){
      ctx.fillStyle = (r+c)%2 ? "#fff" : "#222";
      ctx.fillRect(x-2 + c*sq, GROUND_Y-150 + r*sq, sq, sq);
    }
    ctx.fillStyle = "#222";
    ctx.font = "bold 18px 'Comic Sans MS', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(T("FINISH"), x+34, GROUND_Y-100);
  }
}

function drawCharacter(emoji, cx, cy, size, facing, baseDir, bob, squashY=1){
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.beginPath();
  ctx.ellipse(cx, cy + size*0.5, size*0.42, size*0.14, 0, 0, 7);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(cx, cy - bob);
  ctx.scale(facing === baseDir ? 1 : -1, squashY);
  ctx.font = size + "px 'Segoe UI Emoji','Apple Color Emoji',sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(emoji, 0, 0);
  ctx.restore();
}

function drawParticles(){
  for (const p of inkParts){
    const f = p.life / p.max;
    ctx.fillStyle = "rgba(" + (p.c || "54,20,74") + "," + ((1 - f) * (p.c ? 0.8 : 0.5)).toFixed(3) + ")";
    ctx.beginPath();
    ctx.arc(worldX(p.x), p.y, p.r * (1 + f * 0.7), 0, 7);
    ctx.fill();
  }
}

function drawPlayer(){
  const a = player.ch;
  const cx = worldX(player.x + player.w/2);
  const cy = player.y + player.h/2;
  const bob = Math.abs(Math.sin(player.runBob*0.15)) * 4;
  let squash = 1;
  if (player.ducking) squash = 0.6;
  else if (!player.grounded) squash = player.vy < 0 ? 1.08 : 0.94;
  const size = player.ducking ? 42 : 46;

  if (player.hurtFlash > 0 && (player.hurtFlash >> 1) % 2 === 0) { /* blink: skip draw */ }
  else drawCharacter(a.emoji, cx, cy, size, player.facing, a.faceDir, bob, squash);

  // the fish gasps when its air is nearly gone
  if (a.airSpan && player.air < 180 && player.air > 0 && (tGlobal>>3)%2===0){
    ctx.fillStyle = "#fff"; ctx.strokeStyle="#c33"; ctx.lineWidth=3;
    ctx.font = "bold 24px sans-serif"; ctx.textAlign="center";
    ctx.strokeText("!", cx, cy - 40); ctx.fillText("!", cx, cy - 40);
  }
}

function drawRacer(){
  const cx = worldX(gecko.x + gecko.w/2);
  const cy = gecko.y + gecko.h/2;
  const bob = (state === "race") ? Math.abs(Math.sin(gecko.anim))*5 : 0;
  drawCharacter(RACER.emoji, cx, cy, RACER.size, 1, RACER.faceDir, bob, 1);
}

function drawHUD(){
  ctx.save();
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  rr(12, 12, 230, 40, 10); ctx.fill();
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.font = "26px 'Segoe UI Emoji', sans-serif";
  ctx.fillText(player.ch.emoji, 22, 33);
  ctx.fillStyle = "#234";
  ctx.font = "bold 15px 'Comic Sans MS', sans-serif";
  ctx.fillText(T(player.ch.name), 56, 33);

  const px = 120, pw = 110;
  ctx.fillStyle = "#cfd6dd"; rr(px, 24, pw, 14, 7); ctx.fill();
  const prog = Math.max(0, Math.min(1, player.x / FINISH_LINE));
  ctx.fillStyle = "#41c75a"; rr(px, 24, pw*prog, 14, 7); ctx.fill();
  ctx.font = "16px 'Segoe UI Emoji', sans-serif";
  ctx.fillText("🏁", px + pw, 33);

  // ink dash recharge (octopus)
  if (player.ch.dash){
    const ready = player.dashCooldown <= 0;
    const frac = ready ? 1 : 1 - player.dashCooldown / DASH_COOLDOWN;
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    rr(252, 12, 116, 38, 10); ctx.fill();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "18px 'Segoe UI Emoji', sans-serif";
    ctx.fillText("💨", 260, 31);
    ctx.fillStyle = "#cfd6dd"; rr(288, 24, 72, 14, 7); ctx.fill();
    ctx.fillStyle = ready ? "#41c75a" : "#f0a830";
    rr(288, 24, 72 * frac, 14, 7); ctx.fill();
    if (ready){
      ctx.fillStyle = "#2c8a3e"; ctx.font = "bold 10px 'Comic Sans MS', sans-serif";
      ctx.textAlign = "center"; ctx.fillText(T("READY"), 324, 31);
    }
  }

  // air span (fish)
  if (player.ch.airSpan){
    const frac = Math.max(0, player.air / player.ch.airSpan);
    const low = player.air < 180;
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    rr(252, 12, 150, 38, 10); ctx.fill();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "18px 'Segoe UI Emoji', sans-serif";
    ctx.fillText("💧", 260, 31);
    ctx.fillStyle = "#cfd6dd"; rr(288, 24, 76, 14, 7); ctx.fill();
    ctx.fillStyle = low ? ((tGlobal>>2)%2 ? "#ff4d4d" : "#ffb0b0") : "#3fa9e0";
    rr(288, 24, 76 * frac, 14, 7); ctx.fill();
    ctx.fillStyle = low ? "#c62828" : "#234";
    ctx.font = "bold 13px 'Comic Sans MS', sans-serif";
    ctx.fillText(Math.ceil(player.air/60) + "s", 370, 31);
  }

  // run timer
  const tw = 134;
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  rr(W/2 - tw/2, 12, tw, 38, 10); ctx.fill();
  ctx.fillStyle = "#234"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "bold 20px 'Comic Sans MS', sans-serif";
  ctx.fillText("⏱ " + formatTime(runMs), W/2, 32);

  // pause button
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.beginPath(); ctx.arc(BTN_PAUSE.cx, BTN_PAUSE.cy, BTN_PAUSE.r, 0, 7); ctx.fill();
  ctx.fillStyle = "#234";
  ctx.fillRect(BTN_PAUSE.cx - 7, BTN_PAUSE.cy - 9, 5, 18);
  ctx.fillRect(BTN_PAUSE.cx + 2, BTN_PAUSE.cy - 9, 5, 18);

  if (muted){
    ctx.fillStyle = "#234"; ctx.font = "bold 13px sans-serif"; ctx.textAlign="right";
    ctx.fillText("🔇", W-58, 24);
  }
  ctx.restore();
}

function drawTouchControls(){
  if (!touchMode) return;
  ctx.save();

  // left drag stick
  ctx.globalAlpha = touch.stickId !== null ? 0.7 : 0.5;
  ctx.fillStyle = "#0d2a12";
  rr(STICK.cx - STICK.w/2, STICK.cy - STICK.h/2, STICK.w, STICK.h, STICK.h/2); ctx.fill();
  ctx.globalAlpha = touch.stickId !== null ? 0.95 : 0.8;
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
  rr(STICK.cx - STICK.w/2, STICK.cy - STICK.h/2, STICK.w, STICK.h, STICK.h/2); ctx.stroke();
  // arrows
  ctx.fillStyle = "#fff";
  for (const s of [-1, 1]){
    const ax = STICK.cx + s * (STICK.w/2 - 24);
    ctx.beginPath();
    ctx.moveTo(ax - s*8, STICK.cy - 11);
    ctx.lineTo(ax + s*9, STICK.cy);
    ctx.lineTo(ax - s*8, STICK.cy + 11);
    ctx.closePath(); ctx.fill();
  }
  // knob
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = touch.stickId !== null ? "#ffe14d" : "#eef6ee";
  ctx.beginPath(); ctx.arc(STICK.cx + touch.knob, STICK.cy, STICK.knobR, 0, 7); ctx.fill();
  ctx.strokeStyle = "#0d2a12"; ctx.lineWidth = 3; ctx.stroke();

  // right buttons
  const inkMode = player.ch.dash;
  ctx.globalAlpha = touch.jumpDown ? 1 : 0.85;
  ctx.fillStyle = touch.jumpDown ? "#ffd24d" : (inkMode ? "#b15bd0" : "#4fb04f");
  ctx.beginPath(); ctx.arc(BTN_JUMP.cx, BTN_JUMP.cy, BTN_JUMP.r, 0, 7); ctx.fill();
  ctx.strokeStyle = "#0d2a12"; ctx.lineWidth = 4; ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "bold 19px 'Comic Sans MS', sans-serif";
  ctx.fillText(inkMode ? T("INK") : T("JUMP"), BTN_JUMP.cx, BTN_JUMP.cy);

  ctx.globalAlpha = touch.duckDown ? 1 : 0.85;
  ctx.fillStyle = touch.duckDown ? "#ffd24d" : "#3f7fc4";
  ctx.beginPath(); ctx.arc(BTN_DUCK.cx, BTN_DUCK.cy, BTN_DUCK.r, 0, 7); ctx.fill();
  ctx.strokeStyle = "#0d2a12"; ctx.lineWidth = 4; ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#fff";
  ctx.font = "bold 17px 'Comic Sans MS', sans-serif";
  ctx.fillText(T("DUCK"), BTN_DUCK.cx, BTN_DUCK.cy);

  ctx.restore();
}

function bigButton(id, cx, cy, w, h, label, fill="#41c75a", size=26){

  rr(x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 4;
  rr(x, y, w, h, 14); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `bold ${size}px 'Comic Sans MS', sans-serif`;

  ctx.restore();
  uiButton(id, x, y, w, h);
}

function drawToast(){

  ctx.save();
  ctx.globalAlpha = Math.min(1, toastT/18);
  // low while playing, high on the menus so it never sits on top of the buttons
  const ty = playing() ? H - 74 : 8;
  const w = 320, h = 44;
  ctx.fillStyle = "rgba(12,32,18,0.92)";

  ctx.strokeStyle = "#ffe14d"; ctx.lineWidth = 2;
  rr(W/2 - w/2, ty, w, h, 12); ctx.stroke();
  ctx.fillStyle = "#ffe14d"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "bold 18px 'Comic Sans MS', sans-serif";
  ctx.fillText(toast, W/2, ty + h/2);
  ctx.restore();
}

function drawLevels(){
  // preview the highlighted level's own colours behind the cards
  const keep = THEME;
  THEME = LEVELS[levelIndex].theme;
  drawBackground();
  dim(0.34);
  THEME = keep;

  centerText(T("Pick a level!"), 54, 38, "#fff");

  const n = LEVELS.length;
  const cardW = 300, gap = 44, cardH = 236;
  const totalW = n*cardW + (n-1)*gap;
  const x0 = (W - totalW)/2;
  for (let i=0;i<n;i++){
    const L = LEVELS[i];
    const x = x0 + i*(cardW+gap);
    const sel = i === levelIndex;
    const y = 104 + (sel ? -10 : 0);
    const locked = !!L.comingSoon;
    ctx.save();
    ctx.fillStyle = locked ? "rgba(225,228,232,0.78)"
                           : (sel ? "#fff5d6" : "rgba(255,255,255,0.82)");
    rr(x, y, cardW, cardH, 16); ctx.fill();
    ctx.strokeStyle = sel ? "#ffb300" : "#9aa"; ctx.lineWidth = sel ? 6 : 3;
    rr(x, y, cardW, cardH, 16); ctx.stroke();

    ctx.textAlign = "center";
    const bob = sel ? Math.sin(tGlobal*0.12)*6 : 0;
    ctx.globalAlpha = locked ? 0.55 : 1;
    ctx.font = "72px 'Segoe UI Emoji', sans-serif";
    ctx.fillText(L.icon, x + cardW/2, y + 92 + bob);
    ctx.globalAlpha = 1;

    ctx.fillStyle = "#234"; ctx.font = "bold 25px 'Comic Sans MS',sans-serif";
    ctx.fillText(T(L.name), x + cardW/2, y + 148);

    // blurb, wrapped to the card
    ctx.fillStyle = locked ? "#667" : "#456";
    ctx.font = "13px 'Comic Sans MS',sans-serif";
    const words = T(L.blurb).split(" ");
    let line = "", ly = y + 178;
    for (const wd of words){
      const test = line ? line + " " + wd : wd;
      if (ctx.measureText(test).width > cardW - 36 && line){
        ctx.fillText(line, x + cardW/2, ly); line = wd; ly += 18;
      } else line = test;
    }
    if (line) ctx.fillText(line, x + cardW/2, ly);

    if (locked){
      ctx.fillStyle = "#8a6a2e"; ctx.font = "bold 15px 'Comic Sans MS',sans-serif";
      ctx.fillText(T("🔒 COMING SOON"), x + cardW/2, y + cardH - 14);
    }
    ctx.restore();
    uiButton("lvl"+i, x, y, cardW, cardH);

    // every level carries its own high-scores button
    bigButton("hs"+i, x + cardW/2, 392, cardW, 44, T("🏆 HIGH SCORES"), "#3f7fc4", 19);
  }

  if (LEVELS[levelIndex].comingSoon)
    bigButton("go", W/2 - 96, 480, 210, 52, T("🔒 LOCKED"), "#98a2ac", 22);
  else
    bigButton("go", W/2 - 96, 480, 210, 52, T("GO!"));
  bigButton("back", W/2 + 150, 480, 180, 44, T("BACK"), "#7a8a99", 20);
}

function drawScores(){

  THEME = keep;

  const list = Leaderboard.loadKey(L.scoreKey);

  } else {
    const rowH = 30, w = 460, y0 = 146;

    ctx.textBaseline = "middle";

      const e = list[i], ry = y0 + i*rowH;

        ctx.fillStyle = "rgba(255,225,77,0.22)";
        rr(cx-w/2, ry-rowH/2+1, w, rowH-2, 6); ctx.fill();
        ctx.strokeStyle = "#ffe14d"; ctx.lineWidth = 2;
        rr(cx-w/2, ry-rowH/2+1, w, rowH-2, 6); ctx.stroke();
      }
      ctx.fillStyle = i === 0 ? "#fff" : "#e8eef5";
      ctx.font = (i === 0 ? "bold " : "") + "17px 'Comic Sans MS', sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("#" + (i+1), cx-w/2+16, ry);
      ctx.font = "20px 'Segoe UI Emoji', sans-serif";
      ctx.fillText(e.a, cx-w/2+64, ry);
      ctx.font = (i === 0 ? "bold " : "") + "17px 'Comic Sans MS', sans-serif";
      ctx.fillText(e.n, cx-w/2+98, ry);
      ctx.textAlign = "right";
      ctx.fillText(formatTime(e.t), cx+w/2-16, ry);
    }
    ctx.restore();
  }
  bigButton("back", W/2 - 110, 486, 200, 48, T("BACK"), "#41c75a", 24);
  bigButton("reset", W/2 + 130, 486, 210, 40, T("CLEAR TIMES"), "#c25a5a", 17);
}

function drawCountdown(){
  let label = "";
  if (countdownStep === 3) label = "3";
  else if (countdownStep === 2) label = "2";
  else if (countdownStep === 1) label = "1";
  else label = T("GO");
  ctx.save();
  const scale = 1 + (countdownTimer/50)*0.5;
  ctx.translate(W/2, 180);
  ctx.scale(scale, scale);
  centerText(label, 0, 90, countdownStep===0 ? "#ffe14d" : "#fff");
  ctx.lineWidth=5; ctx.strokeStyle="#1d5a24";
  ctx.strokeText(label, 0, 0);
  ctx.restore();
  centerText(T("Ready…"), 90, 26, "#fff");
}

function drawEnd(win){
  dim(0.62);
  const cx = W/2;
  if (win){
    const pieces = lastRank >= 0 ? 64 : 38;
    for (let i = 0; i < pieces; i++){
      const t = (tGlobal*4 + i*37);
      ctx.fillStyle = ["#ff5a5a","#5aff8a","#5aa8ff","#ffe14d","#ff8ad8"][i%5];
      ctx.fillRect((i*47 + t)%W, (i*29 + t*1.3)%H, 7, 11);
    }
    centerText(T("🎉 YOU WIN! 🎉"), 70, 44, "#ffe14d");
    centerText(T("Your time:") + "  " + formatTime(lastTime), 118, 26, "#fff");
    if (lastRank >= 0){
      const msg = lastRank === 0 ? T("🏆 NEW BEST TIME! 🏆") : tRankMsg(lastRank);
      const pulse = 1 + Math.sin(tGlobal*0.2)*0.07;
      ctx.save(); ctx.translate(cx, 176); ctx.scale(pulse, pulse);
      ctx.fillStyle = "#8fff5a"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "bold 26px 'Comic Sans MS', sans-serif";
      ctx.fillText(msg, 0, 0); ctx.restore();
    }
  } else {
    centerText(T("So close!"), 80, 44, "#fff");
    centerText(tLoseMsg(RACER.name, RACER.emoji), 130, 24, "#ffd2d2");
  }
  bigButton("again", cx, 290, 300, 60, T("PLAY AGAIN"));
  bigButton("scores", cx, 362, 300, 48, T("🏆 HIGH SCORES"), "#3f7fc4", 21);
  bigButton("levels", cx, 428, 300, 44, T("CHOOSE LEVEL"), "#7a8a99", 19);
}

// ------------------------------------------------------------------
// Render
// ------------------------------------------------------------------
function render(){
  uiButtons = [];
  if (state === "title"){ drawTitle(); drawToast(); return; }
  if (state === "levels"){ drawLevels(); drawToast(); return; }
  if (state === "scores"){ drawScores(); drawToast(); return; }
  if (state === "pick"){ drawPick(); drawToast(); return; }

  drawBackground();
  drawCave();
  drawTrees();
  for (const s of SOLIDS) drawSolid(s);
  drawWater();
  for (const hz of HAZARDS) drawHazard(hz);
  drawLogs();
  drawFireballs();
  drawIcicles();
  drawSnowballs();
  drawShards();
  drawCheckpoints();
  drawStartFinish();
  drawSigns();
  if (raceStarted) drawRacer();
  drawParticles();
  drawPlayer();
  if (state !== "win" && state !== "lose") drawHUD();

  if (state === "countdown") drawCountdown();
  if (state === "win") drawEnd(true);
  if (state === "lose") drawEnd(false);
  if (state === "paused"){
    dim(0.55);
    centerText(T("⏸ Paused"), 190, 50, "#fff");
    bigButton("resume", W/2, 290, 280, 60, T("KEEP PLAYING"));
  }
  // controls sit on top of everything, so the countdown never covers them
  if (playing()) drawTouchControls();
  drawToast();
}

// ------------------------------------------------------------------
// Main loop (fixed timestep)
// ------------------------------------------------------------------
let acc = 0, last = performance.now();
const STEP = 1000/60;
function frame(now){
  acc += now - last; last = now;
  if (acc > 250) acc = 250;
  while (acc >= STEP){
    handleEdges();
    if (state !== "paused") update();
    acc -= STEP;
  }
  render();
  Music.sync();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
