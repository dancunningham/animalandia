const keys = {};
let jumpBuffer = 0;
let confirmEdge = false, leftEdge = false, rightEdge = false, pauseEdge = false, muteEdge = false, resetEdge = false;
let toast = "", toastT = 0;
function setToast(t){ toast = t; toastT = 140; }

const JUMP_KEYS = ["Space","ArrowUp","KeyW"];
const LEFT_KEYS = ["ArrowLeft","KeyA"];
const RIGHT_KEYS = ["ArrowRight","KeyD"];

addEventListener("keydown", (e) => {
  if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) {
    // edge events (only on first press)
    if (JUMP_KEYS.includes(e.code)) jumpBuffer = BUFFER;
    if (e.code === "Enter" || e.code === "Space") confirmEdge = true;
    if (LEFT_KEYS.includes(e.code)) leftEdge = true;
    if (RIGHT_KEYS.includes(e.code)) rightEdge = true;
    if (e.code === "KeyP" || e.code === "Escape") pauseEdge = true;
    if (e.code === "KeyM") muteEdge = true;
    if (e.code === "KeyR") resetEdge = true;
  }
  keys[e.code] = true;
  ensureAudio();
}, { passive:false });

addEventListener("keyup", (e) => { keys[e.code] = false; });

function held(list){ return list.some(k => keys[k]); }
const jumpHeld = () => held(JUMP_KEYS);
const leftHeld = () => held(LEFT_KEYS);
const rightHeld = () => held(RIGHT_KEYS);

// ------------------------------------------------------------------
// Audio (generated, no asset files)
// ------------------------------------------------------------------
let actx = null, muted = false;
function ensureAudio(){
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (actx && actx.state === "suspended") actx.resume();
}
function beep(freq, dur=0.12, type="square", vol=0.15){
  if (!actx || muted) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(actx.destination);
  const t = actx.currentTime;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur);
}

// background music (generated): calm during play, exciting during the race
const Music = {
  timer:null, track:null, step:0,
  tempo:{ calm:300, fast:165 }, // ms per step
  mel:{
    calm:[392,null,523,null,659,null,523,null,440,null,392,null,330,null,392,null],
    fast:[523,659,784,659,523,659,784,880,784,659,523,440,523,659,784,880],
  },
  bass:{
    calm:[131,null,null,null,98,null,null,null,110,null,null,null,98,null,null,null],
    fast:[131,131,174,174,196,196,174,174,131,131,174,174,196,196,220,220],
  },
  start(track){
    if (this.track === track && this.timer) return;
    this.track = track; this.step = 0;
    if (this.timer) clearInterval(this.timer);
    this.timer = setInterval(() => this.tick(), this.tempo[track]);
  },
  stop(){ if (this.timer) clearInterval(this.timer); this.timer = null; this.track = null; },
  tick(){
    if (!actx || muted || !this.track) return;
    const fast = this.track === "fast";
    const m = this.mel[this.track][this.step % this.mel[this.track].length];
    const b = this.bass[this.track][this.step % this.bass[this.track].length];
    if (m) this.note(m, fast ? "square" : "triangle", fast ? 0.06 : 0.05, fast ? 0.14 : 0.30);
    if (b) this.note(b, "sine", 0.09, fast ? 0.14 : 0.34);
    this.step++;
  },
  note(freq, type, vol, dur){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.03);
  },
  sync(){
    if (!actx || state === "paused") return;
    this.start(state === "race" ? "fast" : "calm");
  },
};

    catch(e){ return this._mem[this.KEY] || []; }
  },
  save(list){
    this._mem[this.KEY] = list;
    try { localStorage.setItem(this.KEY, JSON.stringify(list)); } catch(e){}
  },
  add(timeMs, animal){
    const list = this.load();
    const entry = { t: Math.round(timeMs), a: animal.emoji, n: animal.name };
    list.push(entry);
    list.sort((x, y) => x.t - y.t);
    const rank = list.indexOf(entry);
    this.save(list.slice(0, 10));
    return rank < 10 ? rank : -1;
  },
  reset(){ this._mem[this.KEY] = []; try { localStorage.removeItem(this.KEY); } catch(e){} },
};

// ------------------------------------------------------------------
// Game state
// ------------------------------------------------------------------
let state = "title"; // title | levels | pick | playing | countdown | race | win | lose | paused
let prevState = "playing";
let pickIndex = 0;
let cameraX = 0;
let tGlobal = 0;
let runMs = 0;       // elapsed time for the current run
let lastTime = 0;    // finishing time of the last completed run
let lastRank = -1;   // leaderboard index of the last run (-1 = not top 10)
let inkParts = [];   // octopus ink / unicorn sparkle particle cloud
loadLevel(0);

const player = {
  x: 80, y: GROUND_Y - PH, w: PW, h: PH,
  vx: 0, vy: 0, facing: 1,
  grounded: false, coyote: 0,
  blockedLeft: false, blockedRight: false,
  standing: null, justJumped: false,
  animal: ANIMALS[0],
  respawnX: 80,
  onBeam: false, balanceTimer: 0, balanceFell: false,
  launched: false, spinTimer: 0,
  distracted: false, distractTimer: 0, distractCooldown: 200,
  hurtFlash: 0, runBob: 0,
  reachedCheck: -1,
  dashTimer: 0, dashCooldown: 0, dashDir: 1, wasClimbing: false,
  noJumpCut: 0, flyLeft: 0, flyTimer: 0,
};

const cow = { x: 0, y: GROUND_Y - 50, w: 56, h: 50, anim:0 };

let countdownTimer = 0, countdownStep = 0, raceStarted = false;

function resetPlayer(animal){
  player.animal = animal;
  player.x = 80; player.y = GROUND_Y - PH;
  player.vx = 0; player.vy = 0; player.facing = 1;
  player.grounded = false; player.coyote = 0;
  player.standing = null; player.respawnX = 80;
  player.onBeam = false; player.balanceTimer = 0; player.balanceFell = false;
  player.launched = false; player.spinTimer = 0;
  player.distracted = false; player.distractTimer = 0; player.distractCooldown = 200;
  player.hurtFlash = 0; player.reachedCheck = -1;
  player.dashTimer = 0; player.dashCooldown = 0; player.dashDir = 1; player.wasClimbing = false;
  player.noJumpCut = 0; player.flyTimer = 0;
  player.flyLeft = animal.flyOnce ? (animal.flyCharges || 1) : 0;
  inkParts.length = 0;
  cow.x = START_LINE - 90; cow.y = GROUND_Y - cow.h;
  raceStarted = false;
  runMs = 0; lastRank = -1;
}

function respawn(){
  player.x = player.respawnX;
  player.y = GROUND_Y - PH;
  player.vx = 0; player.vy = 0;
  player.balanceFell = false; player.balanceTimer = 0;
  player.launched = false;
  player.hurtFlash = 18;
}

// ------------------------------------------------------------------
// Collision (AABB)
// ------------------------------------------------------------------
function overlaps(a, s){
  return a.x < s.x + s.w && a.x + a.w > s.x && a.y < s.y + s.h && a.y + a.h > s.y;
}

// height of the walkable ground at a given world x (slope ramps, else flat ground)
function groundSurfaceY(x){
  for (const sl of SLOPES){
    if (x >= sl.x0 && x <= sl.x1){
      const t = (x - sl.x0) / (sl.x1 - sl.x0);
      return sl.y0 + t * (sl.y1 - sl.y0);
    }
  }
  return GROUND_Y;
}

// the slope the player is currently over (for the downhill speed boost)
function slopeAt(x){
  for (const sl of SLOPES){
    if (x > sl.x0 && x < sl.x1) return sl;
  }
  return null;
}

function skipSolid(s){
  // when balance lost, the player slips off the beam
  return s.type === "beam" && player.balanceFell;
}

function collideX(){
  player.blockedLeft = player.blockedRight = false;
  player.x += player.vx;
  for (const s of SOLIDS){
    if (skipSolid(s)) continue;
    if (overlaps(player, s)){
      // step assist: walk straight up onto very low obstacles (bounce pads)
      const rise = player.y + player.h - s.y;
      if (player.grounded && rise > 0 && rise <= 24){ player.y = s.y - player.h; continue; }
      if (player.vx > 0){ player.x = s.x - player.w; player.blockedRight = true; }
      else if (player.vx < 0){ player.x = s.x + s.w; player.blockedLeft = true; }
      player.vx = 0;
    }
  }
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > WORLD_END) player.x = WORLD_END - player.w;
}

function collideY(){
  const wasGrounded = player.grounded;
  player.grounded = false; player.standing = null;
  player.y += player.vy;
  for (const s of SOLIDS){
    if (skipSolid(s)) continue;
    if (overlaps(player, s)){
      if (player.vy > 0){ player.y = s.y - player.h; player.grounded = true; player.standing = s; }
      else if (player.vy < 0){ player.y = s.y + s.h; }
      player.vy = 0;
    }
  }
  if (player.grounded && !wasGrounded && player.vy === 0) sfx.land();
}

// ------------------------------------------------------------------
// Player update
// ------------------------------------------------------------------
function updatePlayer(allowInput){
  const a = player.animal;

  // --- distraction (dog) ---
  if (a.distract && state !== "countdown"){
    if (player.distracted){
      player.distractTimer--;
      if (player.distractTimer <= 0) player.distracted = false;
    } else if (player.grounded && !player.onBeam){
      player.distractCooldown--;
      if (player.distractCooldown <= 0){
        player.distracted = true;
        player.distractTimer = 38;
        player.distractCooldown = 150 + (Math.random()*120|0);
      }
    }
  }

  // --- octopus ink-jet dash (the jump key, which the octopus can't use to jump) ---
  if (a.dash){
    if (player.dashCooldown > 0) player.dashCooldown--;
    if (player.dashTimer  > 0) player.dashTimer--;
    if (allowInput && !player.distracted && jumpBuffer > 0 &&
        player.dashTimer <= 0 && player.dashCooldown <= 0){
      player.dashTimer = DASH_TIME;
      player.dashCooldown = DASH_COOLDOWN;
      player.dashDir = player.facing;
      jumpBuffer = 0;
      sfx.dash();
    }
  }

  // --- horizontal input ---
  let dir = 0;
  if (allowInput && !player.distracted){
    if (leftHeld()) dir -= 1;
    if (rightHeld()) dir += 1;
  }
  let maxSpeed = a.run;
  if (slopeAt(player.x)) maxSpeed *= (a.slip ? 2.5 : 1.6); // downhill boost; slimy octopus slides fastest
  const accel = a.accel;
  if (dir !== 0){
    if (Math.abs(player.vx) > maxSpeed){
      // boosted above top speed (dash / slingshot / leaving the downhill) — ease back, don't add more
      player.vx += (player.vx > 0 ? -0.3 : 0.3);
    } else {
      player.vx += dir * accel;
      if (player.vx >  maxSpeed) player.vx =  maxSpeed;
      if (player.vx < -maxSpeed) player.vx = -maxSpeed;
    }
    player.facing = dir;
  } else {
    player.vx *= 0.85;
    if (Math.abs(player.vx) < 0.05) player.vx = 0;
  }

  // dash overrides movement for its duration, and squirts an ink trail
  if (player.dashTimer > 0){
    player.vx = player.dashDir * DASH_SPEED;
    player.facing = player.dashDir;
    if (player.dashTimer % 2 === 0){
      inkParts.push({
        x: player.x + player.w/2 - player.dashDir * player.w * 0.45,
        y: player.y + player.h * 0.55,
        vx: -player.dashDir * (1 + Math.random()*1.6), vy: (Math.random()-0.5)*1.2 - 0.3,
        life: 0, max: 22 + Math.random()*12, r: 5 + Math.random()*5,
      });
    }
  }

  collideX();

  // --- octopus climb-over ---
  let climbing = false;
  if (a.climb && allowInput && !player.distracted){
    if ((rightHeld() && player.blockedRight) || (leftHeld() && player.blockedLeft)){
      climbing = true;
    }
  }

  // --- climb slingshot: launch forward when the octopus crawls over the top ---
  if (a.climb){
    if (player.wasClimbing && !climbing){
      player.vx = player.facing * SLINGSHOT_SPEED;
      player.vy = Math.min(player.vy, -3);
      sfx.boing();
    }
    player.wasClimbing = climbing;
  }

  // --- jump ---
  player.coyote = player.grounded ? COYOTE : Math.max(0, player.coyote - 1);
  player.justJumped = false;
  if (allowInput && !player.distracted && !climbing && a.jump > 0 &&
      jumpBuffer > 0 && player.coyote > 0){
    let jv = a.jump;
    if (a.runup) jv = a.jump + (Math.abs(player.vx) / a.run) * 4.2; // dog needs a run-up
    player.vy = -jv;
    player.grounded = false; player.coyote = 0; jumpBuffer = 0;
    player.justJumped = true;
    sfx.jump();
  }

  // --- flight (unicorn/fairy): press JUMP in mid-air, limited charges per run ---
  // locked for the first 0.5s of play so a stray press at the start can't waste it
  if (a.flyOnce){
    if (allowInput && !player.distracted && jumpBuffer > 0 &&
        !player.grounded && player.coyote <= 0 &&
        player.flyLeft > 0 && player.flyTimer <= 0 && runMs > 500){
      player.flyLeft--;
      player.flyTimer = a.flyTime || FLY_TIME;
      jumpBuffer = 0;
      sfx.fly();
    }
    if (player.flyTimer > 0){
      if (player.grounded) player.flyTimer = 0; // landing ends the flight
      else if (tGlobal % 3 === 0){
        inkParts.push({
          x: player.x + player.w/2 - player.facing * player.w * 0.4,
          y: player.y + player.h * 0.7,
          vx: -player.facing * (0.5 + Math.random()), vy: 0.4 + Math.random()*0.6,
          life: 0, max: 18 + Math.random()*10, r: 3 + Math.random()*3,
          c: a.sparkle || "255,215,120",
        });
      }
    }
  }

  // --- vertical motion ---
  if (climbing){
    player.vy = -CLIMB_SPEED;
  } else if (player.flyTimer > 0){
    // flying: hold JUMP to soar up, release to drift gently down
    player.flyTimer--;
    player.vy = jumpHeld() ? (a.flyRise || -2.8) : 1.4;
  } else {
    let g = GRAVITY * a.grav;
    if (player.vy < 0 && jumpHeld() && !a.runup) g *= 0.5; // variable jump height
    player.vy += g;
    if (player.noJumpCut > 0) player.noJumpCut--;
    else if (!jumpHeld() && player.vy < -4 && !player.justJumped) player.vy = -4; // jump cut
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;
  }

  collideY();

  // --- downhill slopes: ride the ramp surface ---
  // gate on the LEFT edge so the snap only starts once the player has fully
  // cleared the last step (whose right edge is the slope's top); otherwise the
  // snap would pull the player down into the side of the step and eject them.
  const cxp = player.x + player.w/2;
  for (const sl of SLOPES){
    if (player.x >= sl.x0 && cxp <= sl.x1 && player.vy >= 0){
      const surf = groundSurfaceY(cxp);
      if (player.y + player.h >= surf - 4){
        player.y = surf - player.h;
        player.vy = 0;
        player.grounded = true;
        player.standing = { type:"slope" };
      }
    }
  }

  // --- balance beam: keep moving or fall ---
  player.onBeam = player.grounded && player.standing && player.standing.type === "beam";
  if (player.onBeam){
    if (Math.abs(player.vx) < 0.5) player.balanceTimer++;
    else player.balanceTimer = 0;
    if (player.balanceTimer > 26){ player.balanceFell = true; sfx.bump(); }
  } else if (player.grounded){
    player.balanceTimer = 0; player.balanceFell = false;
  }

  // --- bounce pad ---
  if (player.grounded && player.standing && player.standing.type === "bounce"){
    player.vy = -BOUNCE_VY;
    player.grounded = false; player.coyote = 0;
    player.noJumpCut = 60; // a pad bounce is always full height
    sfx.boing();
  }

  // --- spinner launch ---
  if (player.grounded && player.standing && player.standing.type === "spinner"){
    if (!player.launched){
      player.vy = -15;
      player.vx = a.run * 1.15;
      player.facing = 1;
      player.launched = true;
      player.spinTimer = 26;
      sfx.spin();
    }
  } else if (player.grounded){
    player.launched = false;
  }
  if (player.spinTimer > 0) player.spinTimer--;

  // --- hazards ---
  for (const hz of HAZARDS){
    if (hz.kind === "spike" && a.spikeImmune) continue; // octopus oozes over spikes
    if (hz.kind === "water" && a.swim) continue;        // octopus swims through water
    if (overlaps(player, hz)){
      if (hz.kind === "spike") sfx.bump(); else sfx.splash();
      respawn();
      break;
    }
  }

  // --- fell off the world (safety net) ---
  if (player.y > H + 60){
    sfx.splash();
    respawn();
  }

  // --- checkpoints ---
  for (let i = 0; i < CHECKPOINTS.length; i++){
    const c = CHECKPOINTS[i];
    if (player.x >= c.tx && player.reachedCheck < i){
      player.reachedCheck = i;
      player.respawnX = c.rx;
      sfx.check();
    }
  }

  // run bob for animation
  player.runBob = (player.grounded && Math.abs(player.vx) > 0.5)
    ? player.runBob + Math.abs(player.vx) * 0.25 : 0;
  if (player.hurtFlash > 0) player.hurtFlash--;
}

// ------------------------------------------------------------------
// Update dispatch
// ------------------------------------------------------------------
function update(){
  tGlobal++;
  cow.anim += 0.2;
  if (state === "playing" || state === "race") runMs += 1000/60; // run clock

  // ink particles drift and fade
  for (const p of inkParts){ p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.life++; }
  if (inkParts.length) inkParts = inkParts.filter(p => p.life < p.max);

  if (state === "playing"){
    updatePlayer(true);
    if (!raceStarted && player.x >= START_LINE){
      raceStarted = true;
      state = "countdown";
      countdownTimer = 50; countdownStep = 3;
      // cow lines up at exactly the same spot as the player — fair start
      cow.x = player.x; cow.y = GROUND_Y - cow.h;
      sfx.count();
    }
  } else if (state === "countdown"){
    updatePlayer(false); // settle, no input
    countdownTimer--;
    if (countdownTimer <= 0){
      countdownStep--;
      if (countdownStep > 0){ countdownTimer = 50; sfx.count(); }
      else if (countdownStep === 0){ countdownTimer = 40; sfx.go(); }
      else { state = "race"; cow.x = player.x; } // exact same start on GO
    }
  } else if (state === "race"){
    updatePlayer(true);
    let cs;
    if (player.animal.dash){
      // octopus: cow is faster than your walk — you MUST ink-dash to win
      cs = 1.1 * player.animal.run;
    } else {
      // others: cow runs at 0.9x the animal's speed, then sprints to 1.1x near the line
      const base = 0.9 * player.animal.run;
      const top  = 1.1 * player.animal.run;
      const distLeft = FINISH_LINE - (cow.x + cow.w);
      cs = base;
      if (distLeft < 320){
        const t = Math.max(0, 1 - distLeft / 320);
        cs = base + (top - base) * t;
      }
    }
    cow.x += cs;
    if (player.x + player.w >= FINISH_LINE){
      state = "win"; sfx.win();
      lastTime = runMs;
      lastRank = Leaderboard.add(runMs, player.animal);
      if (lastRank >= 0) setTimeout(() => sfx.record(), 400);
    }
    else if (cow.x + cow.w >= FINISH_LINE){ state = "lose"; sfx.lose(); }
  }

  // camera
  if (state === "playing" || state === "countdown" || state === "race"){
    let target = player.x + player.w/2 - W/2 + 60;
    cameraX += (target - cameraX) * 0.12;
    cameraX = Math.max(0, Math.min(WORLD_END - W, cameraX));
  }

  jumpBuffer = Math.max(0, jumpBuffer - 1);
}

// ------------------------------------------------------------------
// Menu / state input handling (edges)
// ------------------------------------------------------------------
function handleEdges(){
  if (toastT > 0) toastT--;
  if (muteEdge){ muted = !muted; muteEdge = false; }
  if (resetEdge){ Leaderboard.reset(); lastRank = -1; setToast("Leaderboard reset!"); sfx.check(); resetEdge = false; }

  if (state === "title"){
    if (confirmEdge){ state = "levels"; sfx.select(); }
  } else if (state === "levels"){
    if (leftEdge){ levelIndex = (levelIndex - 1 + LEVELS.length) % LEVELS.length; sfx.select(); }
    if (rightEdge){ levelIndex = (levelIndex + 1) % LEVELS.length; sfx.select(); }
    if (confirmEdge){ loadLevel(levelIndex); state = "pick"; sfx.select(); }
  } else if (state === "pick"){
    if (leftEdge){ pickIndex = (pickIndex - 1 + ROSTER.length) % ROSTER.length; sfx.select(); }
    if (rightEdge){ pickIndex = (pickIndex + 1) % ROSTER.length; sfx.select(); }
    if (confirmEdge){ resetPlayer(ROSTER[pickIndex]); state = "playing"; sfx.go(); }
  } else if (state === "playing" || state === "countdown" || state === "race"){
    if (pauseEdge){ prevState = state; state = "paused"; }
  } else if (state === "paused"){
    if (pauseEdge){ state = prevState; }
  } else if (state === "win" || state === "lose"){
    // return to the level picker so players can switch level or animal
    if (confirmEdge || leftEdge || rightEdge){ state = "levels"; sfx.select(); }
  }

  confirmEdge = leftEdge = rightEdge = pauseEdge = false;
}

// ------------------------------------------------------------------
// Rendering
// ------------------------------------------------------------------
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawBackground(){
  // sky gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,THEME.skyTop); g.addColorStop(1,THEME.skyBottom);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // rainbows arcing behind the hills
  if (THEME.rainbows){
    const bands = ["#ff5a5a","#ffa53f","#ffe14d","#5aff8a","#5aa8ff","#b98aff"];
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 9;
    for (let i=-1;i<3;i++){
      const rx = i*760 - (cameraX*0.25 % 760) + 300;
      for (let b=0;b<bands.length;b++){
        ctx.strokeStyle = bands[b];
        ctx.beginPath();
        ctx.arc(rx, GROUND_Y+30, 170 - b*9, Math.PI, 0);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // parallax hills
  ctx.fillStyle = THEME.hillFar;
  for (let i=-1;i<8;i++){
    const hx = i*420 - (cameraX*0.3 % 420);
    ctx.beginPath();
    ctx.arc(hx+160, GROUND_Y+40, 220, Math.PI, 0);
    ctx.fill();
  }
  ctx.fillStyle = THEME.hillNear;
  for (let i=-1;i<10;i++){
    const hx = i*300 - (cameraX*0.5 % 300);
    ctx.beginPath();
    ctx.arc(hx+120, GROUND_Y+70, 160, Math.PI, 0);
    ctx.fill();
  }
  // clouds
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  for (let i=0;i<6;i++){
    const cx = (i*340 - (cameraX*0.2 % 340) + 100);
    const cy = 70 + (i%3)*40;
    cloud(cx, cy);
  }
  // gentle snowfall on snowy levels
  if (THEME.snow){
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    for (let i=0;i<44;i++){
      const speed = 0.5 + (i%5)*0.22;
      const fx = (((i*97 - cameraX*0.4 + tGlobal*((i%3)-1)*0.3) % W) + W) % W;
      const fy = (i*53 + tGlobal*speed) % H;
      ctx.beginPath();
      ctx.arc(fx, fy, 1.6 + (i%3), 0, 7);
      ctx.fill();
    }
  }
}
function cloud(x,y){
  ctx.beginPath();
  ctx.arc(x,y,22,0,7); ctx.arc(x+26,y+6,28,0,7); ctx.arc(x+56,y,20,0,7);
  ctx.fill();
}

function worldX(x){ return x - cameraX; }

function drawSlopes(){
  for (const sl of SLOPES){
    const ax = worldX(sl.x0), ay = sl.y0;
    const bx = worldX(sl.x1), by = sl.y1;
    if (bx < -40 || ax > W+40) continue;
    // dirt body of the ramp
    ctx.fillStyle = THEME.dirt;
    ctx.beginPath();
    ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
    ctx.lineTo(bx, H+50); ctx.lineTo(ax, H+50);
    ctx.closePath(); ctx.fill();
    // grass/snow surface along the top of the ramp
    ctx.strokeStyle = THEME.top; ctx.lineWidth = 14; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    // motion lines to show it's a fast downhill
    ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 3;
    for (let i=1;i<7;i++){
      const t = i/7, sx = ax+(bx-ax)*t, sy = ay+(by-ay)*t;
      ctx.beginPath(); ctx.moveTo(sx-28, sy-13); ctx.lineTo(sx-6, sy-19); ctx.stroke();
    }
    ctx.lineCap = "butt";
  }
}

function drawSwirls(){
  ctx.save();
  ctx.strokeStyle = "rgba(40,80,160,0.45)";
  ctx.lineWidth = 4;
  for (const s of SWIRLS){
    const cx = worldX(s.x), cy = s.y;
    if (cx < -80 || cx > W+80) continue;
    ctx.beginPath();
    for (let t=0;t<6.3;t+=0.2){
      const r = (t/6.3)*s.r;
      const px = cx + Math.cos(t*1.6)*r, py = cy + Math.sin(t*1.6)*r;
      if (t===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawTrees(){
  const trees = currentLevel.trees;
  if (!trees) return;
  for (let i=0;i<trees.length;i++){
    const t = trees[i];
    const x = worldX(t.x);
    if (x < -80 || x > W+80) continue;
    const baseY = groundSurfaceY(t.x);
    // candy-cane striped trunk
    ctx.fillStyle = "#fff";
    ctx.fillRect(x-6, baseY-64, 12, 64);
    ctx.fillStyle = "#e0533b";
    for (let s=0; s<64; s+=16) ctx.fillRect(x-6, baseY-64+s, 12, 8);
    // fluffy candyfloss top (pink or blue, gently bobbing)
    const bob = Math.sin(tGlobal*0.03 + i)*3;
    const pink = i % 3 !== 1;
    ctx.fillStyle = pink ? "#ffb3e0" : "#bfe0ff";
    ctx.beginPath();
    ctx.arc(x-20, baseY-72+bob, 22, 0, 7);
    ctx.arc(x+20, baseY-72+bob, 22, 0, 7);
    ctx.arc(x, baseY-92+bob, 27, 0, 7);
    ctx.arc(x, baseY-66+bob, 24, 0, 7);
    ctx.fill();
    ctx.fillStyle = pink ? "#ffcce9" : "#d9edff";
    ctx.beginPath();
    ctx.arc(x-10, baseY-84+bob, 12, 0, 7);
    ctx.arc(x+14, baseY-78+bob, 10, 0, 7);
    ctx.fill();
  }
}

function drawSolid(s){
  const x = worldX(s.x), y = s.y;
  if (x + s.w < -40 || x > W+40) return;
  if (s.type === "ground"){
    ctx.fillStyle = THEME.dirt;
    ctx.fillRect(x, y, s.w, s.h);
    ctx.fillStyle = THEME.top;
    ctx.fillRect(x, y, s.w, 14);
    ctx.fillStyle = THEME.topDark;
    for (let gx = (Math.floor(cameraX/24)*24 - cameraX); gx < W; gx += 24){
      if (gx >= x && gx <= x + s.w) ctx.fillRect(gx, y+10, 3, 6);
    }
  } else if (s.type === "bounce"){
    // springy bounce pad
    ctx.fillStyle = "#e0533b"; rr(x, y+8, s.w, s.h-8, 6); ctx.fill();
    ctx.strokeStyle = "#a33523"; ctx.lineWidth = 2;
    for (let i=8;i<s.w-6;i+=16){
      ctx.beginPath(); ctx.moveTo(x+i, y+8); ctx.lineTo(x+i+8, y+s.h); ctx.stroke();
    }
    const squish = Math.sin(tGlobal*0.15)*2;
    ctx.fillStyle = "#ffd24d"; rr(x-4, y+squish, s.w+8, 10, 5); ctx.fill();
    ctx.strokeStyle = "#b07b00"; ctx.lineWidth = 2; rr(x-4, y+squish, s.w+8, 10, 5); ctx.stroke();
  } else if (s.type === "wall"){
    ctx.fillStyle = "#e0533b"; rr(x,y,s.w,s.h,6); ctx.fill();
    ctx.fillStyle = "#ffffff";
    for (let i=0;i<s.h;i+=22){ ctx.fillRect(x, y+i, s.w, 8); }
    ctx.strokeStyle = "#a33523"; ctx.lineWidth = 3; rr(x,y,s.w,s.h,6); ctx.stroke();
  } else if (s.type === "beam"){
    ctx.fillStyle = THEME.beam; rr(x,y,s.w,s.h,6); ctx.fill();
    ctx.strokeStyle = THEME.beamStroke; ctx.lineWidth = 3; rr(x,y,s.w,s.h,6); ctx.stroke();
    ctx.strokeStyle = THEME.beamStroke; ctx.globalAlpha = 0.5;
    for (let i=20;i<s.w;i+=40){ ctx.beginPath(); ctx.moveTo(x+i,y); ctx.lineTo(x+i,y+s.h); ctx.stroke(); }
    ctx.globalAlpha = 1;
  } else if (s.type === "spinner"){
    // spinning disk
    const cx = x + s.w/2, cy = y + s.h/2;
    ctx.fillStyle = "#3f7bd6"; rr(x,y,s.w,s.h,8); ctx.fill();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tGlobal*0.25);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
    for (let i=0;i<4;i++){
      ctx.rotate(Math.PI/2);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(s.w/2-8,0); ctx.stroke();
    }
    ctx.restore();
  } else {
    // platform / step
    ctx.fillStyle = THEME.plat; rr(x,y,s.w,s.h,8); ctx.fill();
    ctx.fillStyle = THEME.platTop; ctx.fillRect(x, y, s.w, 8);
    ctx.strokeStyle = THEME.platStroke; ctx.lineWidth = 3; rr(x,y,s.w,s.h,8); ctx.stroke();
  }
}

function drawHazard(hz){
  const x = worldX(hz.x), y = hz.y;
  if (x + hz.w < -40 || x > W+40) return;
  if (hz.kind === "spike"){
    ctx.fillStyle = THEME.spikeFill;
    const n = 3;
    for (let i=0;i<n;i++){
      const sx = x + i*(hz.w/n);
      ctx.beginPath();
      ctx.moveTo(sx, y+hz.h);
      ctx.lineTo(sx + hz.w/(2*n), y);
      ctx.lineTo(sx + hz.w/n, y+hz.h);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle=THEME.spikeStroke; ctx.lineWidth=2; ctx.stroke();
  } else if (hz.kind === "water"){
    ctx.fillStyle = THEME.water || "rgba(60,140,220,0.55)";
    ctx.fillRect(x, y, hz.w, hz.h+30);
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth=2;
    ctx.beginPath();
    for (let i=0;i<hz.w;i+=20){
      ctx.moveTo(x+i, y+3); ctx.quadraticCurveTo(x+i+10, y-2, x+i+20, y+3);
    }
    ctx.stroke();
  }
}

function drawSigns(){

function drawCheckpoints(){

function drawStartFinish(){
  // start line
  let x = worldX(START_LINE);
  if (x > -20 && x < W+20){
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fillRect(x-2, GROUND_Y-120, 4, 120);
  }
  // finish banner (checkered)
  x = worldX(FINISH_LINE);
  if (x > -60 && x < W+60){
    ctx.fillStyle = "#333"; ctx.fillRect(x-4, GROUND_Y-150, 8, 150);
    const bw=70, bh=40, sq=10;
    for (let r=0;r<bh/sq;r++) for (let c=0;c<bw/sq;c++){
      ctx.fillStyle = (r+c)%2 ? "#fff" : "#222";
      ctx.fillRect(x-2 + c*sq, GROUND_Y-150 + r*sq, sq, sq);
    }
    ctx.fillStyle = "#222";
    ctx.font = "bold 18px 'Comic Sans MS', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("FINISH", x+34, GROUND_Y-100);

function drawCharacter(emoji, cx, cy, size, facing, baseDir, bob, squashY=1){
  // soft shadow
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.beginPath();
  ctx.ellipse(cx, cy + size*0.5, size*0.42, size*0.14, 0, 0, 7);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(cx, cy - bob);
  // mirror the emoji art so it faces the way the character is moving
  ctx.scale(facing === baseDir ? 1 : -1, squashY);
  ctx.font = size + "px 'Segoe UI Emoji','Apple Color Emoji',sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(emoji, 0, 0);
  ctx.restore();
}

function drawInk(){
  for (const p of inkParts){
    const f = p.life / p.max;
    ctx.fillStyle = "rgba(" + (p.c || "54,20,74") + "," + ((1 - f) * (p.c ? 0.85 : 0.5)).toFixed(3) + ")";
    ctx.beginPath();
    ctx.arc(worldX(p.x), p.y, p.r * (1 + f * 0.7), 0, 7);
    ctx.fill();
  }
}

function drawPlayer(){
  const a = player.animal;
  const cx = worldX(player.x + player.w/2);
  const cy = player.y + player.h/2;
  const bob = Math.abs(Math.sin(player.runBob*0.15)) * 4;
  let squash = 1;
  if (!player.grounded) squash = player.vy < 0 ? 1.08 : 0.94;
  let face = player.facing;
  if (player.distracted) face = -player.facing; // dog looks the other way

  if (player.hurtFlash > 0 && (player.hurtFlash >> 1) % 2 === 0) { /* blink: skip draw */ }
  else drawCharacter(a.emoji, cx, cy, 46, face, a.faceDir, bob, squash);

  if (player.distracted){
    ctx.fillStyle = "#fff"; ctx.strokeStyle="#333"; ctx.lineWidth=3;
    ctx.font = "bold 26px sans-serif"; ctx.textAlign="center";
    ctx.strokeText("?", cx, cy - 40); ctx.fillText("?", cx, cy - 40);
  }
}

function drawCow(){
  const cx = worldX(cow.x + cow.w/2);
  const cy = cow.y + cow.h/2;
  if (RACER.kind === "candyfloss"){
    // a big fluffy candyfloss ball rolling along the ground
    const r = 27;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath();
    ctx.ellipse(cx, cow.y + cow.h, r*0.9, 7, 0, 0, 7);
    ctx.fill();
    ctx.translate(cx, cy);
    ctx.rotate(cow.x * 0.045); // roll with distance travelled
    ctx.fillStyle = "#ff9fd6";
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    // fluffy lobes around the edge
    ctx.fillStyle = "#ffb3e0";
    for (let i=0;i<6;i++){
      const a2 = i * Math.PI/3;
      ctx.beginPath();
      ctx.arc(Math.cos(a2)*r*0.85, Math.sin(a2)*r*0.85, r*0.42, 0, 7);
      ctx.fill();
    }
    // swirl so the rolling reads clearly
    ctx.strokeStyle = "#e878ba"; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(0, 0, r*0.55, 0, Math.PI*1.35); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r*0.25, Math.PI, Math.PI*2.4); ctx.stroke();
    ctx.restore();
  } else {
    const bob = (state === "race") ? Math.abs(Math.sin(cow.anim))*5 : 0;
    drawCharacter(RACER.emoji, cx, cy, 54, 1, 1, bob, 1);
  }
}

function drawHUD(){
  // animal + progress bar
  ctx.save();
  ctx.fillStyle = "rgba(255,255,255,0.85)";

  // progress
  const px = 120, pw = 110;
  ctx.fillStyle = "#cfd6dd"; rr(px, 24, pw, 14, 7); ctx.fill();
  const prog = Math.max(0, Math.min(1, player.x / FINISH_LINE));

  // dash recharge meter (octopus only)
  if (player.animal.dash){
    const ready = player.dashCooldown <= 0;

    ctx.fillStyle = "rgba(255,255,255,0.85)";

    ctx.textAlign = "left"; ctx.textBaseline = "middle";

    ctx.fillText("💨", 260, 31);
    ctx.fillStyle = "#cfd6dd"; rr(288, 24, 72, 14, 7); ctx.fill();
    ctx.fillStyle = ready ? "#41c75a" : "#f0a830";
    rr(288, 24, 72 * frac, 14, 7); ctx.fill();
    if (ready){
      ctx.fillStyle = "#2c8a3e"; ctx.font = "bold 10px 'Comic Sans MS', sans-serif";
      ctx.textAlign = "center"; ctx.fillText("READY", 324, 31);
    }
  }

  // one-use flight badge (unicorn only)
  if (player.animal.flyOnce){
    const flying = player.flyTimer > 0;
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    rr(252, 12, 116, 38, 10); ctx.fill();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "18px 'Segoe UI Emoji', sans-serif";
    ctx.fillText("✨", 260, 31);
    ctx.font = "bold 13px 'Comic Sans MS', sans-serif";
    if (flying){
      ctx.fillStyle = "#b06fd0";
      ctx.fillText("FLYING!", 288, 31);
    } else if (player.flyLeft <= 0){
      ctx.fillStyle = "#9aa3ad";
      ctx.fillText("FLY USED", 288, 31);
    } else if (player.flyLeft > 1){
      ctx.fillStyle = "#2c8a3e";
      ctx.fillText("FLY ×" + player.flyLeft, 288, 31);
    } else {
      ctx.fillStyle = "#2c8a3e";
      ctx.fillText("FLY READY", 288, 31);
    }
  }

  // run timer (top center)
  const tw = 134;
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  rr(W/2 - tw/2, 12, tw, 38, 10); ctx.fill();
  ctx.fillStyle = "#234"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "bold 20px 'Comic Sans MS', sans-serif";
  ctx.fillText("⏱ " + formatTime(runMs), W/2, 32);

  if (muted){
    ctx.fillStyle = "#234"; ctx.font = "bold 13px sans-serif"; ctx.textAlign="right";
    ctx.fillText("🔇 muted (M)", W-14, 22);
  }
  ctx.restore();
}

function formatTime(ms){
  const s = ms/1000, m = Math.floor(s/60), sec = s - m*60;
  return m + ":" + (sec < 10 ? "0" : "") + sec.toFixed(1);
}

  dim(0.62);
  const cx = W/2;
  if (win){
    // confetti — extra lively when you make the board
    const pieces = lastRank >= 0 ? 64 : 38;
    for (let i = 0; i < pieces; i++){
      const t = (tGlobal*4 + i*37);
      ctx.fillStyle = ["#ff5a5a","#5aff8a","#5aa8ff","#ffe14d","#ff8ad8"][i%5];
      ctx.fillRect((i*47 + t)%W, (i*29 + t*1.3)%H, 7, 11);
    }
    centerText("🎉 YOU WIN! 🎉", 56, 44, "#ffe14d");
    centerText("Your time:  " + formatTime(lastTime), 96, 24, "#fff");
    if (lastRank >= 0){
      const msg = lastRank === 0
        ? "🏆 NEW BEST TIME! 🏆"
        : "⭐ TOP 10 — you're #" + (lastRank+1) + "! ⭐";
      const pulse = 1 + Math.sin(tGlobal*0.2)*0.07;
      ctx.save(); ctx.translate(cx, 132); ctx.scale(pulse, pulse);
      ctx.fillStyle = "#8fff5a"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "bold 24px 'Comic Sans MS', sans-serif";
      ctx.fillText(msg, 0, 0); ctx.restore();
      drawLeaderboard(cx, 174, lastRank);
    } else {
      drawLeaderboard(cx, 150, -1);
    }
  } else {
    centerText("So close!", 56, 44, "#fff");
    centerText("The " + RACER.name + " won this time " + RACER.emoji + " — try again!", 96, 22, "#ffd2d2");
    drawLeaderboard(cx, 150, -1);
  }
  centerText("Press SPACE to pick a level & play again", 504, 22, "#fff");
  centerText("(press R to reset the best times)", 528, 13, "#9fb0c0", "");
}

function render(){
  if (state === "title"){ drawTitle(); return; }
  if (state === "levels"){ drawLevels(); return; }
  if (state === "pick"){ drawPick(); return; }

  // world
  drawBackground();
  drawSwirls();
  drawTrees();
  for (const s of SOLIDS) drawSolid(s);
  drawSlopes();
  for (const hz of HAZARDS) drawHazard(hz);
  drawCheckpoints();
  drawStartFinish();
  drawSigns();
  if (raceStarted || state==="race" || state==="countdown") drawCow();
  drawInk();
  drawPlayer();
  if (state !== "win" && state !== "lose") drawHUD();

  if (state === "countdown") drawCountdown();
  if (state === "win") drawEnd(true);
  if (state === "lose") drawEnd(false);
  if (state === "paused"){
    dim(0.55);
    centerText("⏸ Paused", 230, 50, "#fff");
    centerText("Press P to keep playing", 300, 24, "#cfe");
  }
}

// ------------------------------------------------------------------
// Main loop (fixed timestep)
// ------------------------------------------------------------------
let acc = 0, last = performance.now();
const STEP = 1000/60;
function frame(now){
  acc += now - last; last = now;
  if (acc > 250) acc = 250;
  while (acc >= STEP){
    handleEdges();
    if (state !== "paused") update();
    acc -= STEP;
  }
  render();
  drawToast();
  Music.sync();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
